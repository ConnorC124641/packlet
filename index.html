<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packlet</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #2e96df;
      --panel: #7350b6;
      --panel-2: #5142a1;
      --line: #8f78dc;
      --text: #eef4ff;
      --muted: #d7e7ff;
      --accent: #38d1c8;
      --accent-2: #ffd25f;
      --warn: #ffcc66;
      --bad: #ff5e73;
      --good: #4ee078;
      --shadow: rgba(0, 0, 0, .35);
      --radius: 12px;
      font-family: "Avenir Next", "Trebuchet MS", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(81, 243, 215, .34), transparent 28rem),
        radial-gradient(circle at top right, rgba(117, 109, 255, .34), transparent 28rem),
        linear-gradient(180deg, #25bccd, #2f9ee8 58%, #4569d7),
        var(--bg);
      color: var(--text);
      letter-spacing: 0;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -160px 0 0;
      pointer-events: none;
      z-index: -1;
      opacity: .22;
      background:
        linear-gradient(25deg, transparent 0 35%, rgba(255,255,255,.13) 35% 55%, transparent 55%),
        radial-gradient(circle at 8% 12%, rgba(255,255,255,.18) 0 34px, transparent 35px),
        radial-gradient(circle at 31% 4%, rgba(255,255,255,.13) 0 58px, transparent 59px),
        radial-gradient(circle at 55% 16%, rgba(255,255,255,.15) 0 42px, transparent 43px),
        radial-gradient(circle at 82% 7%, rgba(255,255,255,.14) 0 52px, transparent 53px);
      background-size: 360px 420px;
      animation: fallingBlooks 18s linear infinite;
    }

    @keyframes fallingBlooks {
      to { transform: translateY(420px); }
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #6250b9;
      color: var(--text);
      border-radius: 11px;
      min-height: 42px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;
    }

    button:hover { border-color: #bfc1ff; background: #715bd1; transform: translateY(-1px); box-shadow: 0 8px 18px rgba(0,0,0,.18); }
    button:active { transform: translateY(1px) scale(.99); }
    button.primary { background: linear-gradient(135deg, #19c8dc, #25b8d6); border-color: transparent; color: white; font-weight: 900; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
    button.ghost { background: transparent; }
    button.danger { background: #381923; border-color: #713044; color: #ffd7de; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      color: var(--text);
      background: rgba(50, 44, 116, .72);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 11px;
      outline: none;
    }

    textarea { min-height: 76px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-2); }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }

    .app {
      display: grid;
      grid-template-columns: 238px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-right: 8px solid rgba(40, 48, 134, .45);
      background: linear-gradient(180deg, #7150b6, #5145a6 58%, #34489d);
      backdrop-filter: blur(14px);
      padding: 18px;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #23c7d9, #38dded);
      box-shadow: 0 14px 35px var(--shadow);
      color: #05110d;
      font-size: 24px;
      font-weight: 900;
    }

    .brand h1 { margin: 0; font-size: 24px; line-height: 1; font-weight: 900; }
    .brand span { color: var(--muted); font-size: 12px; }

    .userbox, .authbox {
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 18% 0, rgba(255,255,255,.14), transparent 32%),
        rgba(72, 61, 157, .82);
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .pillrow { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(51, 47, 125, .58);
      color: #fff;
      font-size: 12px;
      min-width: 0;
    }

    .limited-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border: 1px solid rgba(255, 210, 95, .82);
      border-radius: 999px;
      padding: 3px 7px;
      background: linear-gradient(135deg, rgba(255, 210, 95, .22), rgba(255, 137, 207, .16));
      color: #ffe8a6;
      font-size: 11px;
      font-weight: 1000;
      text-transform: uppercase;
      box-shadow: 0 0 14px rgba(255, 210, 95, .14);
    }

    .market-hint {
      border: 1px dashed rgba(255,255,255,.24);
      border-radius: 9px;
      padding: 7px 9px;
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .tabs {
      display: grid;
      gap: 7px;
    }

    .tab {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      border-color: transparent;
      color: rgba(255,255,255,.88);
    }

    .tab.active {
      color: var(--text);
      background: rgba(255,255,255,.95);
      border-color: transparent;
      color: #9a45ad;
    }

    main {
      padding: 26px;
      overflow: visible;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .topbar h2 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1;
      font-weight: 900;
      color: white;
      text-shadow: 0 5px 0 rgba(45, 77, 133, .24);
    }

    .topbar p {
      margin: 0;
      color: var(--muted);
      max-width: 820px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 14px;
    }

    .widegrid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
      gap: 16px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 18% 0, rgba(255,255,255,.12), transparent 32%),
        rgba(153, 70, 177, .94);
      border-radius: var(--radius);
      box-shadow: 0 6px 0 rgba(85, 47, 142, .55), 0 18px 45px rgba(0, 0, 0, .18);
      overflow: hidden;
    }

    .card.pad { padding: 16px; }
    .card h3 { margin: 0 0 10px; font-size: 18px; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .hidden { display: none !important; }
    .row { display: flex; align-items: center; gap: 9px; }
    .row.wrap { flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .stack { display: grid; gap: 10px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .pack {
      display: grid;
      grid-template-rows: 166px auto;
      min-height: 285px;
      transition: transform .18s ease, box-shadow .18s ease;
      overflow: visible;
      position: relative;
      z-index: 1;
    }

    .pack:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 55px rgba(0,0,0,.26);
      z-index: 8;
    }

    .pack-art {
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      cursor: pointer;
    }

    .pack-art:hover .pack-icon {
      transform: scale(1.04) rotate(-1deg);
    }

    .pack-art::before {
      content: "";
      position: absolute;
      inset: -60px;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 12px, transparent 12px 26px);
      animation: drift 12s linear infinite;
    }

    .pack-art::after {
      content: "Click to open";
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 2;
      padding: 5px 8px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      background: rgba(6,10,18,.58);
      color: rgba(255,255,255,.85);
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .16s ease, transform .16s ease;
    }

    .pack-art:hover::after,
    .pack-art:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    .pack-icon {
      position: relative;
      width: 108px;
      height: 108px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.18), transparent 30%),
        rgba(8, 10, 15, .6);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 18px 45px rgba(0,0,0,.32);
      transition: transform .18s ease;
    }

    .pack-showcase {
      width: 92px;
      height: 92px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .pack-showcase .fruit-art,
    .pack-showcase .space-art,
    .pack-showcase .emoji-art {
      position: absolute;
      margin: 0;
      transform: translate(-50%, -50%) scale(var(--s, 1));
      left: var(--x, 50%);
      top: var(--y, 50%);
      z-index: var(--z, 1);
    }

    .pack-showcase .fruit-art {
      width: 32px;
      height: 32px;
    }

    .pack-showcase .space-art {
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }

    .pack-showcase .centerpiece {
      --x: 50%;
      --y: 50%;
      --s: 1.38;
      --z: 3;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.35));
    }

    .pack-showcase .top-left { --x: 28%; --y: 28%; --s: .86; --z: 2; }
    .pack-showcase .top-right { --x: 72%; --y: 28%; --s: .86; --z: 2; }
    .pack-showcase .mid-left { --x: 18%; --y: 55%; --s: .78; --z: 1; }
    .pack-showcase .mid-right { --x: 82%; --y: 55%; --s: .78; --z: 1; }
    .pack-showcase .bottom-left { --x: 34%; --y: 78%; --s: .74; --z: 1; }
    .pack-showcase .bottom-right { --x: 66%; --y: 78%; --s: .74; --z: 1; }

    .pack-showcase::before {
      content: "";
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.16), transparent 62%);
      z-index: 0;
    }

    @keyframes drift {
      to { transform: translate3d(60px, 60px, 0); }
    }

    .blook {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 72px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background:
        radial-gradient(circle at 16% 0, rgba(255,255,255,.07), transparent 30%),
        #101824;
      padding: 10px;
    }

    .blookface {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--r1), var(--r2));
      color: #06100d;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
      position: relative;
      overflow: hidden;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: 16px;
    }

    .collection-pack {
      border-top: 4px solid rgba(255,255,255,.92);
      padding-top: 10px;
      margin-top: 16px;
    }

    .collection-title {
      padding: 0 0 2px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .collection-title h3 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 0;
      color: white;
      text-shadow: 0 4px 0 rgba(39, 49, 123, .38);
    }

    .blook-tile {
      min-height: 124px;
      display: grid;
      grid-template-rows: 1fr auto;
      align-content: start;
      gap: 8px;
      border: 0;
      border-radius: 10px;
      padding: 0;
      background:
        radial-gradient(circle at 50% 18%, color-mix(in srgb, var(--r1), transparent 76%), transparent 32%),
        linear-gradient(180deg, color-mix(in srgb, var(--r1), #ffffff 18%), var(--r2));
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 5px 0 rgba(35, 39, 111, .35);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      cursor: pointer;
      text-align: left;
      color: var(--text);
    }

    .blook-tile:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: color-mix(in srgb, var(--r1), white 20%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.2), 0 7px 0 rgba(35, 39, 111, .35);
    }

    .blook-tile-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px 8px;
      min-width: 0;
    }

    .blook-tile-art {
      min-height: 86px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: transparent;
      box-shadow: none;
      overflow: hidden;
    }

    .blook-tile-art .fruit-art,
    .blook-tile-art .space-art,
    .blook-tile-art .emoji-art {
      width: 74px;
      height: 74px;
      border-radius: 14px;
    }

    .blook-tile strong {
      max-width: 78px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    .collection-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 26px;
      align-items: start;
    }

    .collection-panel {
      max-height: calc(100vh - 160px);
      overflow: auto;
      border: 4px solid rgba(107, 99, 205, .9);
      background:
        radial-gradient(circle at 8% 8%, rgba(255,255,255,.08), transparent 18%),
        rgba(103, 77, 180, .95);
      border-radius: 10px;
      padding: 18px 22px;
      box-shadow: 0 6px 0 rgba(45, 63, 166, .42), 0 18px 50px rgba(0,0,0,.16);
    }

    .collection-score-card {
      position: sticky;
      top: 24px;
      border: 4px solid rgba(107, 99, 205, .9);
      border-radius: 10px;
      padding: 18px;
      background:
        radial-gradient(circle at 22% 14%, rgba(255,255,255,.13), transparent 24%),
        rgba(103, 77, 180, .9);
      box-shadow: 0 6px 0 rgba(45, 63, 166, .42), 0 18px 50px rgba(0,0,0,.16);
    }

    .score-star {
      width: 150px;
      height: 150px;
      margin: 4px auto 18px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 30px;
      font-weight: 1000;
      text-align: center;
      text-shadow: 0 3px 0 rgba(92, 39, 16, .45);
      background:
        radial-gradient(circle, #5572ff 0 36%, #33348c 37% 48%, transparent 49%),
        linear-gradient(135deg, #ffd35d, #4be0c5);
      clip-path: polygon(50% 0, 62% 32%, 97% 28%, 70% 50%, 88% 82%, 50% 64%, 12% 82%, 30% 50%, 3% 28%, 38% 32%);
      filter: drop-shadow(0 8px 0 rgba(31,45,122,.42));
    }

    .score-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      text-align: center;
    }

    .score-stat strong {
      display: block;
      font-size: 28px;
      color: white;
      text-shadow: 0 3px 0 rgba(62, 37, 114, .35);
    }

    .score-stat span {
      display: block;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      font-weight: 800;
    }

    .blook-tile input[type="number"] {
      min-width: 0;
      flex: 1 1 78px;
    }

    .profile-pic {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--panel-2), #0c1119);
      border: 1px solid var(--line);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .profile-pic .fruit-art,
    .profile-pic .space-art,
    .profile-pic .emoji-art {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .message .profile-pic {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: inline-grid;
      vertical-align: middle;
      margin-right: 6px;
    }

    .message .profile-pic .fruit-art,
    .message .profile-pic .space-art,
    .message .profile-pic .emoji-art {
      width: 20px;
      height: 20px;
      border-radius: 6px;
    }

    .profile-pic.large {
      width: 86px;
      height: 86px;
      border-radius: 16px;
    }

    .profile-pic.large .fruit-art,
    .profile-pic.large .space-art,
    .profile-pic.large .emoji-art {
      width: 70px;
      height: 70px;
      border-radius: 14px;
    }

    .fruit-art {
      --fruit-main: #ff3045;
      --fruit-mid: #ef1f36;
      --fruit-dark: #b90d22;
      --fruit-leaf: #57d665;
      --fruit-stem: #a26319;
      width: 42px;
      height: 42px;
      position: relative;
      display: inline-block;
      flex: 0 0 auto;
      filter: drop-shadow(0 7px 8px rgba(0,0,0,.28));
    }

    .fruit-art.small {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,.22));
    }

    .fruit-art.large {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 18px 20px rgba(0,0,0,.32));
    }

    .pack-icon .fruit-art {
      width: 30px;
      height: 30px;
      margin: -3px;
    }

    .pack-showcase .fruit-art {
      width: 32px;
      height: 32px;
      margin: 0;
    }

    .fruit-core, .fruit-detail, .fruit-stem, .fruit-leaf {
      position: absolute;
      display: block;
    }

    .fruit-core {
      inset: 12% 7% 7%;
      border-radius: 24% 24% 18% 18%;
      background:
        radial-gradient(circle at 68% 24%, rgba(255,255,255,.25), transparent 13%),
        linear-gradient(135deg, var(--fruit-main), var(--fruit-mid) 55%, var(--fruit-dark));
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.12);
    }

    .fruit-stem {
      width: 11%;
      height: 31%;
      left: 51%;
      top: 1%;
      border-radius: 999px;
      background: var(--fruit-stem);
      transform: rotate(9deg);
      z-index: 3;
    }

    .fruit-leaf {
      width: 34%;
      height: 20%;
      left: 25%;
      top: 8%;
      border-radius: 90% 10% 90% 10%;
      background: linear-gradient(135deg, #6df576, var(--fruit-leaf));
      transform: rotate(22deg);
      z-index: 4;
    }

    .fruit-apple { --fruit-main:#ff3850; --fruit-mid:#f20d28; --fruit-dark:#9d0017; }
    .fruit-orange { --fruit-main:#ff9d1b; --fruit-mid:#ff7800; --fruit-dark:#b94700; }
    .fruit-lemon { --fruit-main:#fff176; --fruit-mid:#ffe24a; --fruit-dark:#caa51a; }
    .fruit-lime { --fruit-main:#b7eb6a; --fruit-mid:#8fce42; --fruit-dark:#5d9124; }
    .fruit-green-apple { --fruit-main:#8cdf42; --fruit-mid:#6fc736; --fruit-dark:#3f8e22; }

    .fruit-grape .fruit-core,
    .fruit-raspberry .fruit-core,
    .fruit-blue-raspberry .fruit-core {
      inset: 4% 8% 4%;
      border-radius: 0;
      background:
        radial-gradient(circle at 30% 20%, var(--fruit-main) 0 12.5%, transparent 13.4%),
        radial-gradient(circle at 50% 20%, var(--fruit-main) 0 12.5%, transparent 13.4%),
        radial-gradient(circle at 70% 20%, var(--fruit-main) 0 12.5%, transparent 13.4%),
        radial-gradient(circle at 21% 43%, var(--fruit-mid) 0 13.5%, transparent 14.4%),
        radial-gradient(circle at 41% 43%, var(--fruit-mid) 0 13.5%, transparent 14.4%),
        radial-gradient(circle at 61% 43%, var(--fruit-mid) 0 13.5%, transparent 14.4%),
        radial-gradient(circle at 79% 43%, var(--fruit-mid) 0 13.5%, transparent 14.4%),
        radial-gradient(circle at 32% 67%, var(--fruit-dark) 0 14%, transparent 15%),
        radial-gradient(circle at 52% 67%, var(--fruit-dark) 0 14%, transparent 15%),
        radial-gradient(circle at 72% 67%, var(--fruit-dark) 0 14%, transparent 15%);
      box-shadow: none;
    }

    .fruit-grape { --fruit-main:#8c35ff; --fruit-mid:#6f18dc; --fruit-dark:#44108c; --fruit-leaf:#35c45e; }
    .fruit-raspberry { --fruit-main:#ef3e3e; --fruit-mid:#d7192f; --fruit-dark:#94101e; --fruit-leaf:#48c858; }
    .fruit-blue-raspberry { --fruit-main:#5ec4ff; --fruit-mid:#248ee2; --fruit-dark:#1360a6; --fruit-leaf:#77dbff; }

    .fruit-strawberry .fruit-core {
      inset: 9% 16% 5%;
      clip-path: polygon(50% 100%, 12% 38%, 22% 12%, 78% 12%, 88% 38%);
      border-radius: 45% 45% 54% 54%;
      background:

    .chatlog, .tradelog {
      height: 430px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: #090d14;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .message {
      padding: 9px 10px;
      border-radius: 8px;
      background: #121925;
      border: 1px solid #1e2a3b;
      overflow-wrap: anywhere;
      max-width: min(78%, 620px);
      align-self: flex-start;
    }

    .message.own {
      align-self: flex-end;
      background: #10231f;
      border-color: #28584d;
    }

    .message.system {
      align-self: center;
      max-width: 92%;
      background: #101722;
      border-style: dashed;
    }

    .message .name { font-weight: 800; }
    .message .admin { color: #ff6f61; font-size: 11px; margin-left: 5px; }

    .statgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 14px;
    }

    .stat span { color: var(--muted); display: block; font-size: 12px; }
    .stat strong { display: block; font-size: 28px; margin-top: 4px; }

    .wheel-wrap {
      display: grid;
      place-items: center;
      gap: 14px;
      padding: 18px;
    }

    .wheel {
      position: relative;
      width: min(72vw, 340px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(
        #21d19f 0 51.42deg,
        #5aa7ff 51.42deg 102.84deg,
        #c88cff 102.84deg 154.26deg,
        #ffd36b 154.26deg 205.68deg,
        #ff89cf 205.68deg 257.1deg,
        #ff6f61 257.1deg 308.52deg,
        #70fff4 308.52deg 360deg
      );
      border: 10px solid #121925;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      transition: transform 3.2s cubic-bezier(.16, .84, .22, 1);
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 30%;
      border-radius: 50%;
      background: #0d121b;
      border: 1px solid rgba(255,255,255,.18);
    }

    .slice-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: rotate(var(--a)) translateY(-138px) rotate(calc(-1 * var(--a)));
      transform-origin: center;
      color: #05070a;
      font-weight: 900;
      font-size: 13px;
      z-index: 2;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 28px solid var(--text);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
      margin-bottom: -24px;
      z-index: 3;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.72);
      z-index: 20;
      padding: 18px;
    }

    .modal-inner {
      width: min(660px, 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #101722;
      padding: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
      text-align: center;
      position: relative;
    }

    .modal-close {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .opening-stage {
      min-height: 390px;
      display: grid;
      place-items: center;
      overflow: visible;
      position: relative;
      isolation: isolate;
    }

    .opening-stage::before {
      content: "";
      position: absolute;
      inset: 8% 10%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.2), transparent 42%),
        radial-gradient(circle, rgba(112,255,244,.13), transparent 58%);
      transform: scale(.8);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    .opening-stage.bloom::before {
      animation: stageBloom 1.2s ease forwards;
    }

    .opening-stage.epic-plus::after {
      content: "";
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 2;
    }

    .opening-stage.rarity-epic::after {
      background:
        radial-gradient(circle at 28% 26%, #f0ddff 0 1.8%, transparent 2.3%),
        radial-gradient(circle at 72% 28%, #c88cff 0 2%, transparent 2.5%),
        radial-gradient(circle at 24% 76%, #c88cff 0 1.7%, transparent 2.2%),
        radial-gradient(circle at 78% 74%, #f0ddff 0 1.7%, transparent 2.2%),
        radial-gradient(circle, transparent 38%, rgba(200,140,255,.3), transparent 62%);
      animation: epicSparkle 1.8s ease-out forwards;
    }

    .opening-stage.rarity-legendary::after {
      background:
        conic-gradient(from 8deg, transparent 0 7%, rgba(255,211,107,.82) 7% 10%, transparent 10% 18%, rgba(255,241,181,.72) 18% 21%, transparent 21% 100%),
        radial-gradient(circle, rgba(255,211,107,.32), transparent 56%);
      animation: legendaryRays 1.95s ease-out forwards;
    }

    .opening-stage.rarity-chroma::after {
      background:
        conic-gradient(from 0deg, #70fff4, #5aa7ff, #c88cff, #ff89cf, #ffd36b, #70fff4);
      mix-blend-mode: screen;
      animation: chromaWheel 2.15s ease-out forwards;
    }

    .opening-stage.rarity-supreme::after {
      background:
        radial-gradient(circle, rgba(255,137,207,.55), transparent 38%),
        conic-gradient(from 0deg, transparent, rgba(255,137,207,.8), rgba(112,255,244,.7), transparent, rgba(255,211,107,.65), transparent);

        conic-gradient(from 0deg, transparent, rgba(255,211,107,.85), transparent, rgba(255,111,97,.95), transparent, rgba(255,137,207,.75), transparent);
      mix-blend-mode: screen;
      animation: mythicShock 3.2s ease-out forwards;
    }

    .opening-stage.rarity-mythic .opening-ring {
      border-color: rgba(255,211,107,.62);
      box-shadow:
        0 0 80px rgba(255,111,97,.5),

    .mythic-banner {

    .opening-pack {
      width: 184px;
      height: 184px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      font-size: 88px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.22), transparent 22% 72%, rgba(0,0,0,.2)),
        linear-gradient(135deg, var(--c1), var(--c2));
      animation: packIdle 1.2s ease-in-out infinite;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.22),
        inset 0 -12px 0 rgba(0,0,0,.16),
        0 22px 70px rgba(0,0,0,.42);

      z-index: 3;
      overflow: hidden;

    .opening-pack::before {
      content: "";
      position: absolute;
      inset: -55%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.4), transparent 34%),
        linear-gradient(135deg, transparent 20%, rgba(255,255,255,.35), transparent 72%);

      position: relative;
      z-index: 2;
      transform: scale(1.14);

    .opening-pack::after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      top: 16%;
      height: 12%;
      border-radius: 999px;
      background: rgba(255,255,255,.28);
      box-shadow: 0 72px 0 -7px rgba(0,0,0,.12);

    .opening-ring {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.28);
      box-shadow: 0 0 55px rgba(90,167,255,.28);
      animation: ringPulse .48s ease-in-out infinite;

        { name: "Green Astronaut", icon: "💚", rarity: "chroma", chance: 0.05, boosted: true, visual: "space", rim: "#42d66b" },
        { name: "Cyan Astronaut", icon: "🩵", rarity: "chroma", chance: 0.05, boosted: true, visual: "space", rim: "#45f0e7" },
        { name: "Blue Astronaut", icon: "💙", rarity: "chroma", chance: 0.05, boosted: true, visual: "space", rim: "#4f9dff" },
        { name: "Purple Astronaut", icon: "💜", rarity: "chroma", chance: 0.05, boosted: true, visual: "space", rim: "#a66bff" },
        { name: "Brown Astronaut", icon: "🤎", rarity: "chroma", chance: 0.05, boosted: true, visual: "space", rim: "#8b5a2b" },
        { name: "Black Astronaut", icon: "🖤", rarity: "chroma", chance: 0.05, boosted: true, visual: "space", rim: "#1d2433" },
        { name: "Space Terminal", icon: "🖥️", rarity: "supreme", chance: 0.01, boosted: true, visual: "space" },
        { name: "Space Debugger", icon: "🛰️", rarity: "mythic", chance: 0.0075, boosted: true, visual: "space" },
        { name: "Tim the Alien", icon: "👾", rarity: "mythic", chance: 0.005, boosted: true, visual: "space" },
        { name: "Rainbow Astronaut", icon: "🌈", rarity: "mythic", chance: 0.004, boostChance: 0.008, visual: "space" }
      ] },
      { id: "summer", name: "Summer Pack", icon: "☀️", c1: "#ffcf5b", c2: "#31d6c8", cost: 500, limited: true, blooks: [
        { name: "Sand Castle", icon: "🏖️", rarity: "legendary", chance: 25, visual: "summer", limited: true },
        { name: "Surfboard", icon: "🏄", rarity: "legendary", chance: 25, visual: "summer", limited: true },
        { name: "Sun", icon: "☀️", rarity: "chroma", chance: 32, visual: "summer", limited: true },
        { name: "Rainbow Seashell", icon: "🐚", rarity: "supreme", chance: 15, visual: "summer", limited: true },
        { name: "Summer Astronaut", icon: "🧑‍🚀", rarity: "mythic", chance: 3, visual: "summer", limited: true }
      ] }
    ];

    let state = loadState();
    let sessionEmail = localStorage.getItem("packlet_session_email") || "";
    let currentView = "stats";
    let activeTradeId = "";
    let authMode = "login";
    let spinRotation = 0;

    function seedState() {
      return ensureSeededAccounts({
        users: [],
        chats: [],
        listings: [],
        trades: [],
        tradeHistory: [],
        clans: [],
        bans: [],
        logs: []
      });
    }

    function ensureSeededAccounts(savedState) {
      ensureDefaultAdmin(savedState);
      ensurePlasmaAccount(savedState);
      return savedState;
    }

    function ensureDefaultAdmin(savedState) {
      savedState.users ||= [];
      let admin = savedState.users.find(user => user.email === "admin@packlet.local");
      if (!admin) {
        admin = {
          id: id(),
          email: "admin@packlet.local",
          name: "Owner",
          tokens: 250000,
          totalTokens: 250000,
          messages: 0,
          packOpens: 0,
          pings: 0,
          xp: 0,
          muted: false,
          banned: false,
          inventory: [],
          boosterUntil: 0,
          lastWheel: ""
        };
        savedState.users.push(admin);
      }
      admin.password = "packlet-admin";
      admin.plus = true;
      admin.admin = true;
      admin.badge = "PLUS";
      admin.nameColor ||= "#21d19f";
      admin.textColor ||= "#eef4ff";
      admin.paint ||= "rainbow";
      admin.inventory ||= [];
      return savedState;
    }

    function ensurePlasmaAccount(savedState) {
      savedState.users ||= [];
      let plasma = savedState.users.find(user => user.email === "plasma_elemental" || user.name === "plasma_elemental");
      if (!plasma) {
        plasma = {
          id: id(),
          email: "plasma_elemental",
          name: "plasma_elemental",
          tokens: 25000,
          totalTokens: 25000,
          messages: 0,
          packOpens: 0,
          pings: 0,
          xp: 0,
          muted: false,
          banned: false,
          plus: false,
          admin: false,
          badge: "",
          nameColor: "#eef4ff",
          textColor: "#eef4ff",
          paint: "",
          inventory: [],
          boosterUntil: 0,
          lastWheel: ""
        };
        savedState.users.push(plasma);
      }
      plasma.email = "plasma_elemental";
      plasma.name ||= "plasma_elemental";
      plasma.password = "plasma";
      plasma.tokens ??= 25000;
      plasma.totalTokens ??= Math.max(plasma.tokens || 0, 25000);
      plasma.inventory ||= [];
      plasma.messages ??= 0;
      plasma.packOpens ??= 0;
      plasma.pings ??= 0;
      plasma.xp ??= 0;
      plasma.boosterUntil ??= 0;
      plasma.lastWheel ||= "";
      return savedState;
    }

    function loadState() {
      const saved = localStorage.getItem(STORE_KEY);
      if (!saved) return seedState();
      try {
        const parsed = JSON.parse(saved);
        if (!parsed.users?.length) return seedState();
        return ensureSeededAccounts(parsed);
      } catch {
        return seedState();
      }
    }

    function saveState(broadcast = true) {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      if (broadcast && channel) channel.postMessage({ type: "state", state });
      if (broadcast && SERVER_MODE) {
        const headers = { "Content-Type": "application/json" };
        const adminToken = localStorage.getItem("packlet_admin_token");
        if (adminToken) headers["X-Packlet-Admin-Token"] = adminToken;
        fetch("/api/state", {
          method: "POST",
          headers,
          body: JSON.stringify(state)
        }).catch(() => toast("Server save failed. Is Packlet server still running?"));
      }
    }

    async function loadRemoteState() {
      if (!SERVER_MODE) return;
      try {
        const response = await fetch("/api/state");
        const remote = await response.json();
        if (remote?.users?.length) {
          state = ensureSeededAccounts(remote);
          localStorage.setItem(STORE_KEY, JSON.stringify(state));
        } else {
          await fetch("/api/state", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(state)
          });
        }
        render();
        startServerEvents();
      } catch {
        toast("Could not connect to the shared Packlet server.");
      }
    }

    function startServerEvents() {
      if (!SERVER_MODE || !("EventSource" in window)) return;
      const events = new EventSource("/api/events");
      events.onmessage = event => {
        try {
          const remote = JSON.parse(event.data);
          if (remote?.users?.length) {
            state = remote;
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
            render();
          }
        } catch {}
      };
    }

    if (channel) {
      channel.onmessage = event => {
        if (event.data?.type === "state") {
          state = event.data.state;
          render();
        }
      };
    }

    function id() {
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function currentUser() {
      return state.users.find(u => u.email === sessionEmail) || null;
    }

    function isPlus(user) {
      return !!(user?.plus || user?.admin);
    }

    function clanFor(userId) {
      return state.clans.find(c => c.members.includes(userId)) || null;
    }

    function levelFor(user) {
      return Math.max(1, Math.floor((user.xp || 0) / 100) + 1);
    }

    function addXp(user, amount) {
      user.xp = (user.xp || 0) + amount;
    }

    function addTokens(user, amount) {
      user.tokens += amount;
      user.totalTokens = (user.totalTokens || 0) + Math.max(0, amount);
    }

    function spendTokens(user, amount) {
      if (user.tokens < amount) return false;
      user.tokens -= amount;
      return true;
    }

    function toast(message) {
      const wrap = document.getElementById("toast");
      const item = document.createElement("div");
      item.className = "notice";
      item.textContent = message;
      wrap.appendChild(item);
      setTimeout(() => item.remove(), 3200);
    }

    function cssRarity(rarity) {
      const [r1, r2] = rarityColors[rarity] || rarityColors.uncommon;
      return `--r1:${r1};--r2:${r2}`;
    }

    function itemClass(item) {
      return String(item.name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function canonicalBlook(item) {
      const found = packs.flatMap(pack => pack.blooks.map(blook => ({ ...blook, packName: pack.name, packId: pack.id })))
        .find(blook => blook.name === item.name);
      return found ? {
        ...found,
        ...item,
        visual: found.visual || (item.visual === "emoji" ? "" : item.visual),
        rim: found.rim || item.rim,
        icon: found.icon || item.icon,
        packName: found.packName
      } : item;
    }

    function ownedBlooks(user) {
      const seen = new Set();
      return user.inventory.map(canonicalBlook).filter(item => {
        const key = `${item.name}|${item.rarity}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).sort((a, b) => rarityValues[b.rarity] - rarityValues[a.rarity] || a.name.localeCompare(b.name));
    }

    function profileBlook(user) {
      if (!user?.profileBlookName) return null;
      return user.inventory.map(canonicalBlook).find(item => item.name === user.profileBlookName) || null;
    }

    function profilePic(user, size = "") {
      const item = profileBlook(user);
      return `<span class="profile-pic ${size}">${item ? blookVisual(item) : `<span style="font-weight:900;color:var(--accent)">P</span>`}</span>`;
    }

    function fruitVisual(item, size = "") {
      return `<span class="fruit-art fruit-${itemClass(item)} ${size}" aria-hidden="true">
        <span class="fruit-stem"></span>
        <span class="fruit-leaf"></span>
        <span class="fruit-core"></span>
        <span class="fruit-detail"></span>
      </span>`;
    }

    function blookVisual(item, size = "") {
      item = canonicalBlook(item);
      if (item.visual === "space") {
        const isAstronaut = item.name.includes("Astronaut");
        const visualClass = isAstronaut && item.name !== "Rainbow Astronaut" ? "astronaut" : itemClass(item);
        const rim = item.rim ? `--rim:${item.rim}` : "";
        return `<span class="space-art ${visualClass} ${size}" style="${rim}" aria-hidden="true">
          <span class="space-stars"></span>
          <span class="space-core"></span>
          <span class="space-detail"></span>
        </span>`;
      }
      if (item.visual === "summer") {
        return `<span class="summer-art ${itemClass(item)} ${size}" aria-hidden="true">
          <span class="summer-core"></span>
          <span class="summer-detail"></span>
        </span>`;
      }
      if (item.visual === "emoji") {
        return `<span class="emoji-art ${size}" style="${cssRarity(item.rarity)}" aria-hidden="true">${item.icon}</span>`;
      }
      return fruitVisual(item, size);
    }

    function packVisual(pack) {
      const slots = ["top-left", "top-right", "mid-left", "mid-right", "bottom-left", "bottom-right"];
      const featuredByPack = {
        fruit: ["Apple", "Orange", "Lemon", "Grape", "Strawberry", "Starfruit", "Golden Apple"],
        space: ["Earth", "Alien", "UFO", "Astronaut", "Space Terminal", "Pink Astronaut", "Rainbow Astronaut"],
        summer: ["Sand Castle", "Surfboard", "Sun", "Rainbow Seashell", "Summer Astronaut"]
      };
      const featured = featuredByPack[pack.id] || pack.blooks.map(item => item.name);
      const items = featured.map(name => pack.blooks.find(item => item.name === name)).filter(Boolean);
      const center = items[items.length - 1] || pack.blooks[0];
      const outer = items.slice(0, -1);
      return `<div class="pack-showcase pack-${pack.id}">
        ${outer.slice(0, 6).map((item, index) => blookVisual(item, slots[index] || "bottom-right")).join("")}
        ${blookVisual(center, "centerpiece")}
      </div>`;
    }

    function blookCard(item, extra = "") {
      item = canonicalBlook(item);
      return `<div class="blook ${itemClass(item)}" style="${cssRarity(item.rarity)}">
        <div class="blookface">${blookVisual(item)}</div>
        <div style="min-width:0;flex:1">
          <strong>${escapeHtml(item.name)}</strong>
          <div class="row wrap" style="gap:6px">
            <div class="rarity ${item.rarity}">${item.rarity}</div>
            ${blookBadges(item)}
          </div>
          ${extra}
        </div>
      </div>`;
    }

    function collectionBlookCard(item) {
      item = canonicalBlook(item);
      return `<button class="blook-tile open-blook-menu ${itemClass(item)}" data-id="${item.ids[0]}" type="button" style="${cssRarity(item.rarity)}" aria-label="Open ${escapeHtml(item.name)} menu">
        <div class="blook-tile-art">${blookVisual(item, "gallery")}</div>
        <div class="blook-tile-head">
          <strong>${escapeHtml(item.name)}</strong>
          <span class="pill">x${item.count}</span>
        </div>
        ${isLimitedItem(item) ? `<span class="limited-badge" style="margin:0 8px 8px">Limited</span>` : ""}
      </button>`;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
    }

    function money(n) {
      return Number(n || 0).toLocaleString();
    }

    function formatChance(value) {
      return `${Number(value).toFixed(3).replace(/\.?0+$/, "")}%`;
    }

    function rollOdds(pack, boosted) {
      const weighted = pack.blooks.map(item => ({ ...item, weight: boosted && item.boostChance ? item.boostChance : item.chance * (boosted && item.boosted ? 2 : 1) }));
      const total = weighted.reduce((sum, item) => sum + item.weight, 0);
      return weighted.map(item => ({ ...item, rollChance: item.weight / total * 100 }));
    }

    function pickBlook(pack, user) {
      const boosted = Date.now() < (user.boosterUntil || 0);
      const pool = pack.blooks.map(item => ({ ...item, weight: boosted && item.boostChance ? item.boostChance : item.chance * (boosted && item.boosted ? 2 : 1) }));
      const total = pool.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      return pool.find(item => (roll -= item.weight) <= 0) || pool[0];
    }

    function announceRarePull(user, pack, results) {
      const hype = results.filter(item => ["supreme", "mythic"].includes(item.rarity));
      if (!hype.length) return;
      const best = hype.reduce((a, b) => rarityValues[b.rarity] > rarityValues[a.rarity] ? b : a, hype[0]);
      const extra = hype.length > 1 ? ` plus ${hype.length - 1} more supreme/mythic pull${hype.length - 1 === 1 ? "" : "s"}` : "";
      state.chats.push({
        id: id(),
        system: true,
        text: `${user.name} just pulled a ${best.name} from ${pack.name}${extra}!`,
        time: Date.now()
      });
    }

    function addBlook(user, item, source = "market") {
      user.inventory.push({ ...canonicalBlook(item), uid: id(), source, openedAt: Date.now() });
    }

    function packForItem(item) {
      return packs.find(pack => pack.blooks.some(blook => blook.name === item.name)) || null;
    }

    function isLimitedItem(item) {
      const pack = packForItem(item);
      return !!(item.limited || pack?.limited);
    }

    function blookBadges(item) {
      return isLimitedItem(item) ? `<span class="limited-badge">Limited</span>` : "";
    }

    function marketHint(item, price = listingDefaultPrice(item)) {
      const guide = marketGuide[item.name];
      if (!guide) return "";
      let label = "very high";
      if (price < guide.veryLow) label = "very low";
      else if (price < guide.low) label = "low";
      else if (price < guide.fair) label = "fair-ish";
      else if (price < guide.high) label = "high";
      return `<div class="market-hint">Plus market hint: ${label}</div>`;
    }

    function packNameForItem(item) {
      return packForItem(item)?.name || item.source || "Other";
    }

    function listingDefaultPrice(item) {
      const cheapest = state.listings
        .filter(listing => !listing.sold && listing.item.name === item.name && listing.item.rarity === item.rarity)
        .reduce((min, listing) => Math.min(min, listing.price), Infinity);
      if (Number.isFinite(cheapest)) return Math.max(1, cheapest - 1);
      return rarityValues[item.rarity] || 1;
    }

    function groupedInventory(user) {
      return Object.values(user.inventory.reduce((map, item) => {
        const key = `${packNameForItem(item)}:${item.name}:${item.rarity}`;
        map[key] ||= { ...item, packName: packNameForItem(item), count: 0, ids: [] };
        map[key].count++;
        map[key].ids.push(item.uid);
        return map;
      }, {})).sort((a, b) => a.packName.localeCompare(b.packName) || rarityValues[b.rarity] - rarityValues[a.rarity] || a.name.localeCompare(b.name));
    }

    function userById(userId) {
      return state.users.find(u => u.id === userId);
    }

    function render() {
      const user = currentUser();
      document.getElementById("authBox").classList.toggle("hidden", !!user);
      document.getElementById("userBox").classList.toggle("hidden", !user);
      renderTabs(user);
      if (!user) {
        document.getElementById("viewTitle").textContent = "Packlet";
        document.getElementById("viewSubtitle").textContent = "Login or register to enter the dark themed pack market.";
        document.getElementById("quickStats").innerHTML = "";
        document.getElementById("view").innerHTML = `<div class="card pad stack"><h3>Welcome</h3><p class="muted">Use the seeded admin account or make a new player account. This prototype saves everything in this browser.</p></div>`;
        return;
      }
      if (user.banned) {
        document.getElementById("view").innerHTML = `<div class="card pad"><h3>Account banned</h3><p class="muted">An admin banned this account in the local prototype.</p></div>`;
        return;
      }
      if (currentView === "admin" && !user.admin) currentView = "market";
      const view = views.find(v => v[0] === currentView);
      document.getElementById("viewTitle").textContent = view[1];
      document.getElementById("viewSubtitle").textContent = view[2];
      renderUserBox(user);
      renderQuickStats(user);
      document.getElementById("view").innerHTML = renderView(currentView, user);
      bindView(currentView, user);
    }

    function renderTabs(user) {
      document.getElementById("tabs").innerHTML = views
        .filter(v => v[0] !== "admin" || user?.admin)
        .map(v => `<button class="tab ${currentView === v[0] ? "active" : ""}" data-view="${v[0]}" type="button">${iconFor(v[0])} ${v[1]}</button>`)
        .join("");
      document.querySelectorAll("[data-view]").forEach(btn => {
        btn.onclick = () => {
          currentView = btn.dataset.view;
          render();
        };
      });
    }

    function iconFor(view) {
      return ({ market:"🛍️", inventory:"🎒", bazaar:"🏷️", chat:"💬", trade:"🤝", clans:"🏰", wheel:"🎡", stats:"📊", plus:"➕", admin:"🛠️" })[view] || "•";
    }

    function renderUserBox(user) {
      const clan = clanFor(user.id);
      const booster = Math.max(0, user.boosterUntil - Date.now());
      document.getElementById("userBox").innerHTML = `
        <div class="row between">
          <div class="row">${profilePic(user)}<strong style="color:${escapeHtml(user.nameColor || "#eef4ff")}">${escapeHtml(user.name)}</strong></div>
          <button id="logoutBtn" class="ghost" type="button">Logout</button>
        </div>
        <div class="pillrow">
          <span class="pill">${money(user.tokens)} tokens</span>
          <span class="pill">Lvl ${levelFor(user)}</span>
          ${isPlus(user) ? `<span class="pill">Plus</span>` : ""}
          ${user.admin ? `<span class="pill">Admin</span>` : ""}
          ${clan ? `<span class="pill">[${escapeHtml(clan.name)}]</span>` : ""}
        </div>
        <div class="small muted">${booster > 0 ? `${escapeHtml(user.name)} is boosting: ${Math.ceil(booster / 60000)} min left` : "No active booster"}</div>
        ${SERVER_MODE ? `<div class="server-note">Shared server mode is on. Friends who open this server link use the same Packlet world.</div>` : `<div class="server-note">Open with the Packlet server to let friends join the same world.</div>`}
      `;
      document.getElementById("logoutBtn").onclick = () => {
        localStorage.removeItem("packlet_session_email");
        sessionEmail = "";
        render();
      };
    }

    function renderQuickStats(user) {
      const tradeRequests = state.trades.filter(t => t.status === "requested" && t.toId === user.id).length;
      document.getElementById("quickStats").innerHTML = `
        <span class="pill">${money(user.tokens)} tokens</span>
        <span class="pill">${user.inventory.length} blooks</span>
        <span class="pill">${user.messages || 0} msgs</span>
        <span class="pill">${user.packOpens || 0} opens</span>
        ${tradeRequests ? `<span class="pill">${tradeRequests} trade req</span>` : ""}
      `;
    }

    function renderView(view, user) {
      if (view === "market") return renderMarket(user);
      if (view === "inventory") return renderInventory(user);
      if (view === "bazaar") return renderBazaar(user);
      if (view === "chat") return renderChat(user);
      if (view === "trade") return renderTrade(user);
      if (view === "clans") return renderClans(user);
      if (view === "wheel") return renderWheel(user);
      if (view === "stats") return renderStats(user);
      if (view === "plus") return renderPlus(user);
      if (view === "admin") return renderAdmin(user);
      return "";
    }

    function renderMarket(user) {
      const openPacks = packs.filter(p => !p.adminOnly || user.admin);
      const boosted = Date.now() < (user.boosterUntil || 0);
      return `
        <div class="widegrid">
          <div class="grid">
            ${openPacks.map(pack => {
              const packCost = pack.cost || 25;
              return `<article class="card pack" style="--c1:${pack.c1};--c2:${pack.c2}">
              <div class="pack-art open-pack-art" data-pack="${pack.id}" role="button" tabindex="0" aria-label="Open 1 ${pack.name}"><div class="pack-icon">${packVisual(pack)}</div></div>
              <div class="pad stack">
                <div>
                  <h3>${pack.name}</h3>
                  <div class="small muted">${money(packCost)} tokens each. No common blooks.</div>
                </div>
                ${boosted ? `<div class="boost-banner">${escapeHtml(user.name)} is boosting this pack's rare pulls.</div>` : ""}
                <div class="row between wrap">
                  <div class="pillrow">${[...new Set(pack.blooks.map(b => b.rarity))].map(r => `<span class="pill rarity ${r}">${r}</span>`).join("")}</div>
                  <span class="chance-help" tabindex="0">?
                    <span class="chance-popup">
                      <span class="small muted">${boosted ? "Boosted roll odds" : "Base roll odds"}</span>
                      <span class="odds-grid" style="margin-top:8px">
                        ${rollOdds(pack, boosted).map(item => `<span class="odds-item ${itemClass(item)}">
                          <span class="odds-name">${escapeHtml(item.name)}</span>
                          <span class="odds-rarity rarity ${item.rarity}">${item.rarity}</span>
                          <strong>${formatChance(item.rollChance)}</strong>
                        </span>`).join("")}
                      </span>
                    </span>
                  </span>
                </div>
                <div class="small muted">Hover the ? to see chances.</div>
                <div class="row wrap">
                  <button class="primary open-pack" data-pack="${pack.id}" data-count="1" type="button">Open 1</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="10" type="button">Open 10</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="50" type="button">Open 50</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="100" type="button">Open 100</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="500" type="button">Open 500</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="1000" type="button">Open 1000</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="max" type="button">Max</button>
                </div>
              </div>
            </article>`;
            }).join("")}
          </div>
          <aside class="card pad stack">
            <h3>Boosters</h3>
            <p class="muted">Boost epics and above by 2x while active.</p>
            <button class="buy-booster primary" data-hours="1" data-cost="10000" type="button">Buy 1 hr booster - 10,000</button>
            <button class="buy-booster" data-hours="3" data-cost="15000" type="button">Buy 3 hr booster - 15,000</button>
            <h3>Direct Sell Values</h3>
            <div class="stack">${Object.entries(rarityValues).map(([r,v]) => `<div class="row between"><span class="rarity ${r}">${r}</span><strong>${money(v)}</strong></div>`).join("")}</div>
          </aside>
        </div>
      `;
    }

    function renderInventory(user) {
      const grouped = groupedInventory(user);
      const byPack = grouped.reduce((map, item) => {
        map[item.packName] ||= [];
        map[item.packName].push(item);
        return map;
      }, {});
      const myListings = state.listings.filter(listing => !listing.sold && listing.sellerId === user.id);
      const badDupeOptions = grouped.filter(item => item.count > 1 && ["uncommon", "rare", "epic"].includes(item.rarity));
      const unique = new Set(user.inventory.map(item => item.name)).size;
      const value = user.inventory.reduce((sum, item) => sum + (rarityValues[item.rarity] || 0), 0);
      const score = unique * 10 + user.inventory.length + Math.floor(value / 100);
      return `
        <div class="collection-shell">
          <section class="collection-panel stack">
            <div class="row between wrap">
              <h3>Your Blooks</h3>
              <div class="row wrap">
                <button id="toggleMyListings" type="button">My listings (${myListings.length})</button>
                <button id="sellDupes" class="primary" type="button">Sell all dupes</button>
                <button id="sellAll" class="danger" type="button">Sell all</button>
              </div>
            </div>
            <div id="myListingsPanel" class="card pad stack hidden">
              <h3>Your Bazaar Listings</h3>
              <div class="inventory-list">
                ${myListings.length ? myListings.map(listing => blookCard(listing.item, `
                  <div class="small muted">Price: ${money(listing.price)}</div>
                  <button class="cancel-listing" data-id="${listing.id}" type="button">Cancel listing</button>
                `)).join("") : `<p class="muted">You do not have active listings.</p>`}
              </div>
            </div>
            <div class="card pad stack">
              <h3>Custom Bad Dupe Sell</h3>
              <p class="muted small">Choose which epic-and-below duplicates to sell. Packlet keeps one copy of each selected blook.</p>
              <div class="pillrow">
                ${badDupeOptions.length ? badDupeOptions.map(item => `<label class="pill"><input class="bad-dupe-choice" type="checkbox" value="${escapeHtml(item.name)}|${escapeHtml(item.rarity)}" checked style="width:auto"> ${escapeHtml(item.name)} x${item.count - 1}</label>`).join("") : `<span class="muted small">No bad duplicates available.</span>`}
              </div>
              <button id="sellBadDupes" class="primary" type="button" ${badDupeOptions.length ? "" : "disabled"}>Sell selected bad dupes</button>
            </div>
            ${Object.entries(byPack).length ? Object.entries(byPack).map(([packName, items]) => `
              <section class="stack collection-pack">
                <div class="row between wrap collection-title"><h3>${escapeHtml(packName)}</h3><span class="pill">${items.reduce((sum, item) => sum + item.count, 0)} blooks</span></div>
                <div class="collection-grid">
                  ${items.map(item => collectionBlookCard(item)).join("")}
                </div>
              </section>
            `).join("") : `<p class="muted">No blooks yet. Open some packs in the market.</p>`}
          </section>
          <aside class="collection-score-card stack">
            <div class="score-star"><div>${money(score)}<br><span class="small">Blook Score</span></div></div>
            <div class="score-stat-grid">
              <div class="score-stat"><strong>${money(user.inventory.length)}</strong><span>Blooks</span></div>
              <div class="score-stat"><strong>${money(unique)}</strong><span>Unlocked</span></div>
              <div class="score-stat"><strong>${money(value)}</strong><span>Value</span></div>
              <div class="score-stat"><strong>${money(user.packOpens || 0)}</strong><span>Opens</span></div>
            </div>
            <p class="muted small">Click a blook tile to sell, list, or use it as your profile picture.</p>
          </aside>
        </div>
      `;
    }

    function renderBazaar(user) {
      const activeListings = state.listings.filter(l => !l.sold && l.sellerId !== user.id);
      return `
        <div class="card pad stack">
          <div class="row between wrap">
            <h3>Live Bazaar</h3>
            <span class="pill">Manage your own listings from Blooks</span>
          </div>
          <div class="inventory-list">
            ${activeListings.length ? activeListings.sort((a, b) => a.price - b.price).map(l => {
              const seller = userById(l.sellerId);
              return blookCard(l.item, `
                <div class="small muted">Seller: ${escapeHtml(seller?.name || "Unknown")} · Price: ${money(l.price)}</div>
                ${isPlus(user) ? marketHint(canonicalBlook(l.item), l.price) : ""}
                <div class="row wrap" style="margin-top:8px">
                  ${l.sellerId === user.id ? `<button class="cancel-listing" data-id="${l.id}" type="button">Cancel</button>` : `<button class="buy-listing primary" data-id="${l.id}" type="button">Buy</button>`}
                </div>
              `);
            }).join("") : `<p class="muted">No listings yet.</p>`}
          </div>
        </div>
      `;
    }

    function chatName(user) {
      const clan = clanFor(user.id);
      const clanTag = clan ? `<span style="${clan.paint === "rainbow" ? "background:linear-gradient(90deg,#ff6f61,#ffd36b,#21d19f,#5aa7ff,#c88cff);-webkit-background-clip:text;color:transparent" : `color:${escapeHtml(clan.paint || "#9ca9bd")}`}">[${escapeHtml(clan.name)}]</span>` : "";
      return `${profilePic(user)}<span class="name" style="color:${escapeHtml(user.nameColor || "#eef4ff")}">${escapeHtml(user.name)}</span> ${clanTag} ${user.admin ? `<span class="admin">ADMIN</span>` : ""} ${isPlus(user) ? `<span class="pill">PLUS</span>` : ""}`;
    }

    function renderChat(user) {
      return `
        <div class="widegrid">
          <section class="card pad stack">
            <div id="chatLog" class="chatlog">
              ${state.chats.slice(-120).map(m => {
                const author = userById(m.userId);
                if (m.system) return `<div class="message system"><strong>Packlet</strong> <span class="small muted">${new Date(m.time).toLocaleTimeString()}</span><div class="muted">${escapeHtml(m.text)}</div></div>`;
                return `<div class="message ${m.userId === user.id ? "own" : ""}"><div>${author ? chatName(author) : "Unknown"} <span class="small muted">${new Date(m.time).toLocaleTimeString()}</span></div><div style="color:${escapeHtml(author?.textColor || "#eef4ff")}">${escapeHtml(m.text)}</div></div>`;
              }).join("")}
            </div>
            <div class="row">
              <input id="chatInput" maxlength="240" placeholder="${user.muted ? "You are muted" : "Message Packlet..."}" ${user.muted ? "disabled" : ""}>
              <button id="sendChat" class="primary" type="button" ${user.muted ? "disabled" : ""}>Send</button>
            </div>
          </section>
          <aside class="card pad stack">
            <h3>Chat Rewards</h3>
            <p class="muted">Every sent message gives a random 1-5 tokens, adds chat XP, and pings mentioned players with @name.</p>
            <div class="stat"><span>Messages sent</span><strong>${money(user.messages || 0)}</strong></div>
          </aside>
        </div>
      `;
    }

    function renderTrade(user) {
      const trades = state.trades.filter(t => [t.fromId, t.toId].includes(user.id) && ["requested", "open", "declined"].includes(t.status));
      const activeTrade = trades.find(t => t.id === activeTradeId && t.status === "open") || trades.find(t => t.status === "open");
      if (activeTrade) {
        activeTradeId = activeTrade.id;
        const isFrom = activeTrade.fromId === user.id;
        const other = userById(isFrom ? activeTrade.toId : activeTrade.fromId);
        const mine = isFrom ? activeTrade.fromOffer : activeTrade.toOffer;
        const theirs = isFrom ? activeTrade.toOffer : activeTrade.fromOffer;
        const myAccepted = !!activeTrade.accepted?.[user.id];
        const otherAccepted = !!activeTrade.accepted?.[other?.id];
        const bothAccepted = myAccepted && otherAccepted;
        const myConfirmed = !!activeTrade.confirmed?.[user.id];
        const otherConfirmed = !!activeTrade.confirmed?.[other?.id];
        return `
          <div class="widegrid">
            <section class="card pad stack">
              <div class="row between wrap">
                <h3>Private Trade: ${escapeHtml(other?.name || "Unknown")}</h3>
                <button id="leaveTradeView" type="button">Back to requests</button>
              </div>
              <div class="split">
                <div class="card pad stack">
                  <h3>Your Offer</h3>
                  <label>Blooks, up to 4<select id="myTradeBlooks" multiple size="8">${user.inventory.map(i => `<option value="${i.uid}" ${mine.items.some(item => item.uid === i.uid) ? "selected" : ""}>${escapeHtml(i.name)} (${i.rarity})</option>`).join("")}</select></label>
                  <label>Tokens<input id="myTradeTokens" type="number" min="0" value="${mine.tokens || 0}"></label>
                  <button id="saveTradeOffer" type="button">Save offer</button>
                  <button id="acceptTradeOffer" class="primary" type="button">${myAccepted ? "Offer accepted" : "Accept offer"}</button>
                  <button id="confirmTrade" class="primary" type="button" ${bothAccepted && !myConfirmed ? "" : "disabled"}>${myConfirmed ? "Confirmed" : "Confirm trade"}</button>
                </div>
                <div class="card pad stack">
                  ${tradeSide(theirs, "Their offer", `${escapeHtml(other?.name || "Their")} Offer`)}
                  <div class="pillrow">
                    <span class="pill">You: ${myAccepted ? "accepted" : "editing"}</span>
                    <span class="pill">${escapeHtml(other?.name || "Other")}: ${otherAccepted ? "accepted" : "editing"}</span>
                    <span class="pill">Confirm: ${myConfirmed ? "you" : "-"} ${otherConfirmed ? `+ ${escapeHtml(other?.name || "other")}` : ""}</span>
                  </div>
                </div>
              </div>
              <div class="tradelog">${activeTrade.chat.map(m => `<div class="message ${m.userId === user.id ? "own" : ""}"><strong>${escapeHtml(userById(m.userId)?.name || "Unknown")}:</strong> ${escapeHtml(m.text)}</div>`).join("")}</div>
              <div class="row">
                <input id="tradeChatInput" placeholder="Private trade chat">
                <button id="sendTradeChat" type="button">Send</button>
                <button id="cancelTrade" class="danger" type="button">Cancel trade</button>
              </div>
            </section>
            <aside class="card pad stack">
              <h3>How it works</h3>
              <p class="muted">Change your offer as much as you want. Any change resets accepts. Both players accept, then both confirm, then the trade completes and sends you back to Stats.</p>
            </aside>
          </div>
        `;
      }
      const incoming = trades.filter(t => t.status === "requested" && t.toId === user.id);
      const outgoing = trades.filter(t => t.status === "requested" && t.fromId === user.id);
      const declined = trades.filter(t => t.status === "declined");
      return `
        <div class="widegrid">
          <section class="card pad stack">
            <h3>Trade Requests</h3>
            ${incoming.length ? incoming.map(t => {
              const other = userById(t.fromId);
              return `<div class="card pad stack">
                <div class="row between wrap"><strong>${escapeHtml(other?.name || "Unknown")} wants to trade</strong><span class="pill">request</span></div>
                <div class="row wrap">
                  <button class="accept-request primary" data-id="${t.id}" type="button">Accept</button>
                  <button class="decline-request danger" data-id="${t.id}" type="button">Decline</button>
                </div>
              </div>`;
            }).join("") : `<p class="muted">No incoming requests.</p>`}
            <h3>Sent Requests</h3>
            ${outgoing.length ? outgoing.map(t => `<div class="message">Waiting for ${escapeHtml(userById(t.toId)?.name || "Unknown")} to accept.</div>`).join("") : `<p class="muted">No pending sent requests.</p>`}
            ${declined.length ? `<h3>Declined</h3>${declined.map(t => `<div class="message">${escapeHtml(userById(t.toId === user.id ? t.fromId : t.toId)?.name || "Other player")} declined this trade. <button class="clear-trade" data-id="${t.id}" type="button">Clear</button></div>`).join("")}` : ""}
          </section>
          <aside class="card pad stack">
            <h3>Start Trade</h3>
            <label>Username<input id="tradeUserSearch" list="tradeUserList" placeholder="Search a username"></label>
            <datalist id="tradeUserList">${state.users.filter(u => u.id !== user.id && !u.banned).map(u => `<option value="${escapeHtml(u.name)}"></option>`).join("")}</datalist>
            <button id="startTrade" class="primary" type="button">Send request</button>
            <p class="muted small">Type a username and press Enter or Send request.</p>
          </aside>
        </div>
      `;
    }

    function tradeSide(offer, fallback, title) {
      return `<div class="stack"><h3>${title || fallback}</h3><div class="pill">Tokens: ${money(offer.tokens || 0)}</div>${offer.items.length ? offer.items.map(i => blookCard(i)).join("") : `<p class="muted">No blooks</p>`}</div>`;
    }

    function renderClans(user) {
      const myClan = clanFor(user.id);
      return `
        <div class="widegrid">
          <section class="card pad stack">
            <h3>Clans</h3>
            <div class="grid">
              ${state.clans.length ? state.clans.map(c => {
                const owner = userById(c.ownerId);
                const isOwner = c.ownerId === user.id;
                const applied = c.applications.includes(user.id);
                return `<div class="card pad stack">
                  <div class="row between"><strong style="color:${escapeHtml(c.paint || "#eef4ff")}">[${escapeHtml(c.name)}]</strong><span class="pill">Lvl ${Math.max(1, Math.floor((c.xp || 0)/250)+1)}</span></div>
                  <div class="small muted">Owner: ${escapeHtml(owner?.name || "Unknown")} · Members: ${c.members.length}</div>
                  ${myClan?.id === c.id ? `<span class="pill">You are in this clan</span>` : `<button class="apply-clan" data-id="${c.id}" type="button" ${applied ? "disabled" : ""}>${applied ? "Applied" : "Apply"}</button>`}
                  ${isOwner ? `<div class="stack">
                    <label>Clan color<select class="clan-paint" data-id="${c.id}">${(user.admin ? ["rainbow", ...plusPaints] : plusPaints).map(p => `<option ${c.paint === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>
                    <label>Transfer ownership<select class="transfer-clan" data-id="${c.id}">${c.members.filter(id => id !== user.id).map(id => `<option value="${id}">${escapeHtml(userById(id)?.name || "Unknown")}</option>`).join("")}</select></label>
                    <button class="do-transfer" data-id="${c.id}" type="button">Transfer</button>
                    <h3>Applications</h3>
                    ${c.applications.length ? c.applications.map(id => `<div class="row between"><span>${escapeHtml(userById(id)?.name || "Unknown")}</span><button class="accept-clan" data-clan="${c.id}" data-user="${id}" type="button">Accept</button></div>`).join("") : `<p class="muted">No applications.</p>`}
                  </div>` : ""}
                </div>`;
              }).join("") : `<p class="muted">No clans yet.</p>`}
            </div>
          </section>
          <aside class="card pad stack">
            <h3>Create Clan</h3>
            ${isPlus(user) ? `
              <label>Name<input id="clanName" maxlength="18" placeholder="Clan name"></label>
              <label>Paint bucket<select id="clanPaint">${(user.admin ? ["rainbow", ...plusPaints] : plusPaints).map(p => `<option>${p}</option>`).join("")}</select></label>
              <button id="createClan" class="primary" type="button">Create clan</button>
            ` : `<p class="muted">You need Plus to create a clan. Anyone can apply to join one.</p>`}
          </aside>
        </div>
      `;
    }

    function renderWheel(user) {
      const spun = user.lastWheel === todayKey();
      return `
        <div class="card wheel-wrap">
          <div class="pointer"></div>
          <div id="wheel" class="wheel" style="transform:rotate(${spinRotation}deg)">
            ${wheelRewards.map((r, i) => `<span class="slice-label" style="--a:${i * 51.42 + 25.71}deg">${r}</span>`).join("")}
          </div>
          <button id="spinWheel" class="primary" type="button" ${spun ? "disabled" : ""}>${spun ? "Come back tomorrow" : "Spin daily wheel"}</button>
          <div id="wheelResult" class="muted">${spun ? "Already spun today." : "The reward shown at the pointer is the reward you get."}</div>
        </div>
      `;
    }

    function renderStats(user) {
      const unique = new Set(user.inventory.map(i => i.name)).size;
      const clan = clanFor(user.id);
      return `
        <div class="statgrid">
          ${[
            ["Tokens", money(user.tokens)],
            ["Total tokens earned", money(user.totalTokens || 0)],
            ["Messages sent", money(user.messages || 0)],
            ["Blooks unlocked", money(unique)],
            ["Inventory size", money(user.inventory.length)],
            ["Pack opens", money(user.packOpens || 0)],
            ["Pings received", money(user.pings || 0)],
            ["Level", levelFor(user)],
            ["Clan", clan ? `[${escapeHtml(clan.name)}]` : "None"],
            ["Plus", isPlus(user) ? "Yes" : "No"]
          ].map(([label, value]) => `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`).join("")}
        </div>
      `;
    }

    function renderPlus(user) {
      const profileOptions = ownedBlooks(user);
      return `
        <div class="widegrid">
          <section class="card pad stack">
            <h3>Packlet Plus</h3>
            <p class="muted">Plus costs 100,000 tokens. Admins automatically have Plus, but admin status is separate.</p>
            <div class="grid">
              ${["Plus-only blook", "Create clans", "Pick one clan paint bucket color", "Exclusive badge", "Change name", "Change chat text color", "Unlimited bazaar listings", "Open max packs with all tokens", "Rough bazaar value hints"].map(t => `<div class="stat"><span>Plus perk</span><strong style="font-size:18px">${t}</strong></div>`).join("")}
            </div>
            ${isPlus(user) ? `<span class="pill">Plus active</span>` : `<button id="buyPlus" class="primary" type="button">Buy Plus - 100,000 tokens</button>`}
          </section>
          <aside class="card pad stack">
            <h3>Profile</h3>
            <div class="row">${profilePic(user, "large")}<div><strong>${escapeHtml(user.name)}</strong><div class="small muted">Profile picture</div></div></div>
            <label>Profile picture<select id="profileBlook" ${profileOptions.length ? "" : "disabled"}>
              <option value="">Packlet P</option>
              ${profileOptions.map(item => `<option value="${escapeHtml(item.name)}" ${user.profileBlookName === item.name ? "selected" : ""}>${escapeHtml(item.name)} (${item.rarity})</option>`).join("")}
            </select></label>
            ${isPlus(user) ? `
              <label>Name<input id="profileName" maxlength="18" value="${escapeHtml(user.name)}"></label>
              <label>Text color<input id="profileTextColor" type="color" value="${escapeHtml(user.textColor || "#eef4ff")}"></label>
              <label>Name color<input id="profileNameColor" type="color" value="${escapeHtml(user.nameColor || "#eef4ff")}"></label>
              <button id="saveProfile" class="primary" type="button">Save profile</button>
            ` : `<button id="saveProfile" class="primary" type="button">Save profile picture</button><p class="muted">Buy Plus to customize your name and chat colors.</p>`}
          </aside>
        </div>
      `;
    }

    function renderAdmin(user) {
      return `
        <div class="widegrid">
          <section class="card pad stack">
            <h3>Players</h3>
            <table class="compact-table">
              <thead><tr><th>Name</th><th>Tokens</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody>${state.users.map(u => `<tr>
                <td>${escapeHtml(u.name)}<br><span class="small muted">${escapeHtml(u.email)}</span></td>
                <td>${money(u.tokens)}</td>
                <td>${u.admin ? "Admin " : ""}${isPlus(u) ? "Plus " : ""}${u.muted ? "Muted " : ""}${u.banned ? "Banned" : ""}</td>
                <td><div class="row wrap">
                  <button class="toggle-mute" data-id="${u.id}" type="button">${u.muted ? "Unmute" : "Mute"}</button>
                  <button class="toggle-ban danger" data-id="${u.id}" type="button">${u.banned ? "Unban" : "Ban"}</button>
                  <button class="toggle-plus" data-id="${u.id}" type="button">${u.plus ? "Remove Plus" : "Give Plus"}</button>
                  <button class="toggle-admin" data-id="${u.id}" type="button">${u.admin ? "Remove Admin" : "Make Admin"}</button>
                </div></td>
              </tr>`).join("")}</tbody>
            </table>
          </section>
          <aside class="card pad stack">
            <h3>Token Tools</h3>
            <label>Player<select id="adminUser">${state.users.map(u => `<option value="${u.id}">${escapeHtml(u.name)}</option>`).join("")}</select></label>
            <label>Amount<input id="adminAmount" type="number" min="0" value="1000"></label>
            <div class="row"><button id="adminAdd" class="primary" type="button">Add</button><button id="adminSubtract" type="button">Subtract</button></div>
            <h3>Give Blook</h3>
            <label>Blook<select id="adminBlook">${packs.flatMap(p => p.blooks.map(b => `<option value="${escapeHtml(JSON.stringify({...b, packId:p.id}))}">${p.name}: ${b.name} (${b.rarity})</option>`)).join("")}</select></label>
            <button id="adminGiveBlook" class="primary" type="button">Give blook</button>
            <h3>Pack Simulator</h3>
            <p class="muted small">Preview a pull animation without spending tokens or giving inventory.</p>
            <label>Pack<select id="adminSimPack">${packs.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join("")}</select></label>
            <label>Forced pull<select id="adminSimBlook">${packs.flatMap(p => p.blooks.map(b => `<option value="${escapeHtml(JSON.stringify({...b, packId:p.id}))}">${p.name}: ${b.name} (${b.rarity})</option>`)).join("")}</select></label>
            <div class="row wrap">
              <button id="adminSimRandom" type="button">Simulate random</button>
              <button id="adminSimForced" class="primary" type="button">Simulate selected</button>
            </div>
            <h3>Trade History</h3>
            <div class="stack">${state.tradeHistory.slice(-8).reverse().map(t => `<div class="message small">${escapeHtml(t.summary)}</div>`).join("") || `<p class="muted">No completed trades.</p>`}</div>
          </aside>
        </div>
      `;

    function bindView(view, user) {
      if (view === "market") bindMarket(user);
      if (view === "inventory") bindInventory(user);
      if (view === "bazaar") bindBazaar(user);
      if (view === "chat") bindChat(user);
      if (view === "trade") bindTrade(user);
      if (view === "clans") bindClans(user);
      if (view === "wheel") bindWheel(user);
      if (view === "plus") bindPlus(user);
      if (view === "admin") bindAdmin(user);
      const chatLog = document.getElementById("chatLog");

    function openPacks(packId, requested) {
      const user = currentUser();
      const pack = packs.find(p => p.id === packId);
      const packCost = pack.cost || 25;
      let count = requested === "max" ? Math.floor(user.tokens / packCost) : Number(requested);
      const limit = isPlus(user) ? Infinity : 1000;
      count = Math.min(count, Math.floor(user.tokens / packCost), limit);
      if (!count) return toast("Not enough tokens to open that many packs.");
      spendTokens(user, count * packCost);
      const results = [];
      for (let i = 0; i < count; i++) {
        const item = pickBlook(pack, user);
        addBlook(user, item, pack.name);
        results.push(item);
      }
      user.packOpens = (user.packOpens || 0) + count;
      addXp(user, count * 4);
      const clan = clanFor(user.id);
      if (clan) clan.xp = (clan.xp || 0) + count * 4;
      announceRarePull(user, pack, results);
      saveState();
      showOpenModal(pack, results, count);
      render();
    }

      modal.innerHTML = `<div class="modal-inner">
