<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Packlet</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #2e96df;
      --panel: #7350b6;
      --panel-2: #5142a1;
      --line: #8f78dc;
      --text: #eef4ff;
      --muted: #d7e7ff;
      --accent: #38d1c8;
      --accent-2: #ffd25f;
      --warn: #ffcc66;
      --bad: #ff5e73;
      --good: #4ee078;
      --shadow: rgba(0, 0, 0, .35);
      --radius: 12px;
      font-family: "Avenir Next", "Trebuchet MS", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(81, 243, 215, .34), transparent 28rem),
        radial-gradient(circle at top right, rgba(117, 109, 255, .34), transparent 28rem),
        linear-gradient(180deg, #25bccd, #2f9ee8 58%, #4569d7),
        var(--bg);
      color: var(--text);
      letter-spacing: 0;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -160px 0 0;
      pointer-events: none;
      z-index: -1;
      opacity: .22;
      background:
        linear-gradient(25deg, transparent 0 35%, rgba(255,255,255,.13) 35% 55%, transparent 55%),
        radial-gradient(circle at 8% 12%, rgba(255,255,255,.18) 0 34px, transparent 35px),
        radial-gradient(circle at 31% 4%, rgba(255,255,255,.13) 0 58px, transparent 59px),
        radial-gradient(circle at 55% 16%, rgba(255,255,255,.15) 0 42px, transparent 43px),
        radial-gradient(circle at 82% 7%, rgba(255,255,255,.14) 0 52px, transparent 53px);
      background-size: 360px 420px;
      animation: fallingBlooks 18s linear infinite;
    }

    @keyframes fallingBlooks {
      to { transform: translateY(420px); }
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: #6250b9;
      color: var(--text);
      border-radius: 11px;
      min-height: 42px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 800;
      max-width: 100%;
      min-width: 0;
      white-space: normal;
      transition: transform .14s ease, border-color .14s ease, background .14s ease, box-shadow .14s ease;
    }

    button:hover { border-color: #bfc1ff; background: #715bd1; transform: translateY(-1px); box-shadow: 0 8px 18px rgba(0,0,0,.18); }
    button:active { transform: translateY(1px) scale(.99); }
    button.primary { background: linear-gradient(135deg, #19c8dc, #25b8d6); border-color: transparent; color: white; font-weight: 900; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
    button.ghost { background: transparent; }
    button.danger { background: #381923; border-color: #713044; color: #ffd7de; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      color: var(--text);
      background: rgba(50, 44, 116, .72);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px 11px;
      outline: none;
      min-width: 0;
    }

    textarea { min-height: 76px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-2); }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }

    .app {
      display: grid;
      grid-template-columns: 238px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-right: 8px solid rgba(40, 48, 134, .45);
      background: linear-gradient(180deg, #7150b6, #5145a6 58%, #34489d);
      backdrop-filter: blur(14px);
      padding: 18px;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 48px;
      min-width: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #23c7d9, #38dded);
      box-shadow: 0 14px 35px var(--shadow);
      color: #05110d;
      font-size: 24px;
      font-weight: 900;
    }

    .brand h1 { margin: 0; font-size: 24px; line-height: 1; font-weight: 900; }
    .brand span { color: var(--muted); font-size: 12px; }
    .brand h1,
    .brand span { overflow-wrap: anywhere; }

    .userbox, .authbox {
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 18% 0, rgba(255,255,255,.14), transparent 32%),
        rgba(72, 61, 157, .82);
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .authbox > .row:first-child {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .authbox button {
      width: 100%;
    }

    .password-field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
    }

    .password-field button {
      width: auto;
      min-height: 0;
      padding: 0 10px;
      white-space: nowrap;
    }

    .pillrow { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(51, 47, 125, .58);
      color: #fff;
      font-size: 12px;
      min-width: 0;
      max-width: 100%;
    }

    .limited-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border: 1px solid rgba(255, 210, 95, .82);
      border-radius: 999px;
      padding: 3px 7px;
      background: linear-gradient(135deg, rgba(255, 210, 95, .22), rgba(255, 137, 207, .16));
      color: #ffe8a6;
      font-size: 11px;
      font-weight: 1000;
      text-transform: uppercase;
      box-shadow: 0 0 14px rgba(255, 210, 95, .14);
    }

    .market-hint {
      border: 1px dashed rgba(255,255,255,.24);
      border-radius: 9px;
      padding: 7px 9px;
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .tabs {
      display: grid;
      gap: 7px;
    }

    .tab {
      width: 100%;
      min-width: 0;
      justify-content: flex-start;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      border-color: transparent;
      color: rgba(255,255,255,.88);
    }

    .tab.active {
      color: var(--text);
      background: rgba(255,255,255,.95);
      border-color: transparent;
      color: #9a45ad;
    }

    main {
      padding: 26px;
      overflow: visible;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
      min-width: 0;
    }

    .topbar h2 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1;
      font-weight: 900;
      color: white;
      text-shadow: 0 5px 0 rgba(45, 77, 133, .24);
    }

    .topbar p {
      margin: 0;
      color: var(--muted);
      max-width: 820px;
      overflow-wrap: anywhere;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 14px;
    }

    .widegrid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
      gap: 16px;
      align-items: start;
    }

    .card {
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 18% 0, rgba(255,255,255,.12), transparent 32%),
        rgba(153, 70, 177, .94);
      border-radius: var(--radius);
      box-shadow: 0 6px 0 rgba(85, 47, 142, .55), 0 18px 45px rgba(0, 0, 0, .18);
      overflow: hidden;
    }

    .card.pad { padding: 16px; }
    .card h3 { margin: 0 0 10px; font-size: 18px; overflow-wrap: anywhere; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .hidden { display: none !important; }
    .row { display: flex; align-items: center; gap: 9px; }
    .row > * { min-width: 0; }
    .row.wrap { flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .stack { display: grid; gap: 10px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .pack {
      display: grid;
      grid-template-rows: 166px auto;
      min-height: 285px;
      transition: transform .18s ease, box-shadow .18s ease;
      overflow: visible;
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .pack .pad {
      min-width: 0;
    }

    .pack:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 55px rgba(0,0,0,.26);
      z-index: 8;
    }

    .pack-art {
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      cursor: pointer;
    }

    .pack-art:hover .pack-icon {
      transform: scale(1.04) rotate(-1deg);
    }

    .pack-art::before {
      content: "";
      position: absolute;
      inset: -60px;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0 12px, transparent 12px 26px);
      animation: drift 12s linear infinite;
    }

    .pack-art::after {
      content: "Click to open";
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 2;
      padding: 5px 8px;
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      background: rgba(6,10,18,.58);
      color: rgba(255,255,255,.85);
      font-size: 12px;
      font-weight: 800;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .16s ease, transform .16s ease;
    }

    .pack-art:hover::after,
    .pack-art:focus-visible::after {
      opacity: 1;
      transform: translateY(0);
    }

    .pack-icon {
      position: relative;
      width: 108px;
      height: 108px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background:
        radial-gradient(circle at 50% 20%, rgba(255,255,255,.18), transparent 30%),
        rgba(8, 10, 15, .6);
      border: 1px solid rgba(255,255,255,.25);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        0 18px 45px rgba(0,0,0,.32);
      transition: transform .18s ease;
    }

    .pack-showcase {
      width: 92px;
      height: 92px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .pack-showcase .fruit-art,
    .pack-showcase .space-art,
    .pack-showcase .summer-art,
    .pack-showcase .medieval-art,
    .pack-showcase .emoji-art {
      position: absolute;
      margin: 0;
      transform: translate(-50%, -50%) scale(var(--s, 1));
      left: var(--x, 50%);
      top: var(--y, 50%);
      z-index: var(--z, 1);
    }

    .pack-showcase .fruit-art {
      width: 32px;
      height: 32px;
    }

    .pack-showcase .space-art {
      width: 34px;
      height: 34px;
      border-radius: 8px;
    }

    .pack-showcase .centerpiece {
      --x: 50%;
      --y: 50%;
      --s: 1.38;
      --z: 3;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,.35));
    }

    .pack-showcase .top-left { --x: 28%; --y: 28%; --s: .86; --z: 2; }
    .pack-showcase .top-right { --x: 72%; --y: 28%; --s: .86; --z: 2; }
    .pack-showcase .mid-left { --x: 18%; --y: 55%; --s: .78; --z: 1; }
    .pack-showcase .mid-right { --x: 82%; --y: 55%; --s: .78; --z: 1; }
    .pack-showcase .bottom-left { --x: 34%; --y: 78%; --s: .74; --z: 1; }
    .pack-showcase .bottom-right { --x: 66%; --y: 78%; --s: .74; --z: 1; }

    .pack-showcase::before {
      content: "";
      position: absolute;
      inset: 16%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.16), transparent 62%);
      z-index: 0;
    }

    @keyframes drift {
      to { transform: translate3d(60px, 60px, 0); }
    }

    .blook {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 72px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background:
        radial-gradient(circle at 16% 0, rgba(255,255,255,.07), transparent 30%),
      #101824;
      padding: 10px;
      min-width: 0;
    }

    .blookface {
      width: 52px;
      height: 52px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--r1), var(--r2));
      color: #06100d;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
      position: relative;
      overflow: hidden;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
      gap: 16px;
    }

    .collection-pack {
      border-top: 4px solid rgba(255,255,255,.92);
      padding-top: 10px;
      margin-top: 16px;
    }

    .collection-title {
      padding: 0 0 2px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .collection-title h3 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 0;
      color: white;
      text-shadow: 0 4px 0 rgba(39, 49, 123, .38);
    }

    .blook-tile {
      min-height: 124px;
      display: grid;
      grid-template-rows: 1fr auto;
      align-content: start;
      gap: 8px;
      border: 0;
      border-radius: 10px;
      padding: 0;
      background:
        radial-gradient(circle at 50% 18%, color-mix(in srgb, var(--r1), transparent 76%), transparent 32%),
        linear-gradient(180deg, color-mix(in srgb, var(--r1), #ffffff 18%), var(--r2));
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 5px 0 rgba(35, 39, 111, .35);
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
      cursor: pointer;
      text-align: left;
      color: var(--text);
      min-width: 0;
    }

    .blook-tile:hover {
      transform: translateY(-3px) scale(1.03);
      border-color: color-mix(in srgb, var(--r1), white 20%);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.2), 0 7px 0 rgba(35, 39, 111, .35);
    }

    .blook-tile-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 8px 8px;
      min-width: 0;
    }

    .blook-tile-art {
      min-height: 86px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: transparent;
      box-shadow: none;
      overflow: hidden;
    }

    .blook-tile-art .fruit-art,
    .blook-tile-art .space-art,
    .blook-tile-art .summer-art,
    .blook-tile-art .medieval-art,
    .blook-tile-art .emoji-art {
      width: 74px;
      height: 74px;
      border-radius: 14px;
    }

    .blook-tile strong {
      max-width: 78px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }

    .collection-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 26px;
      align-items: start;
    }

    .collection-panel {
      max-height: calc(100vh - 160px);
      overflow: auto;
      border: 4px solid rgba(107, 99, 205, .9);
      background:
        radial-gradient(circle at 8% 8%, rgba(255,255,255,.08), transparent 18%),
        rgba(103, 77, 180, .95);
      border-radius: 10px;
      padding: 18px 22px;
      box-shadow: 0 6px 0 rgba(45, 63, 166, .42), 0 18px 50px rgba(0,0,0,.16);
      min-width: 0;
    }

    .collection-score-card {
      position: sticky;
      top: 24px;
      border: 4px solid rgba(107, 99, 205, .9);
      border-radius: 10px;
      padding: 18px;
      background:
        radial-gradient(circle at 22% 14%, rgba(255,255,255,.13), transparent 24%),
        rgba(103, 77, 180, .9);
      box-shadow: 0 6px 0 rgba(45, 63, 166, .42), 0 18px 50px rgba(0,0,0,.16);
      min-width: 0;
    }

    .score-star {
      width: 150px;
      height: 150px;
      margin: 4px auto 18px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 30px;
      font-weight: 1000;
      text-align: center;
      text-shadow: 0 3px 0 rgba(92, 39, 16, .45);
      background:
        radial-gradient(circle, #5572ff 0 36%, #33348c 37% 48%, transparent 49%),
        linear-gradient(135deg, #ffd35d, #4be0c5);
      clip-path: polygon(50% 0, 62% 32%, 97% 28%, 70% 50%, 88% 82%, 50% 64%, 12% 82%, 30% 50%, 3% 28%, 38% 32%);
      filter: drop-shadow(0 8px 0 rgba(31,45,122,.42));
    }

    .score-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      text-align: center;
    }

    .score-stat strong {
      display: block;
      font-size: 28px;
      color: white;
      text-shadow: 0 3px 0 rgba(62, 37, 114, .35);
    }

    .score-stat span {
      display: block;
      color: rgba(255,255,255,.82);
      font-size: 12px;
      font-weight: 800;
    }

    .blook-tile input[type="number"] {
      min-width: 0;
      flex: 1 1 78px;
    }

    .profile-pic {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--panel-2), #0c1119);
      border: 1px solid var(--line);
      overflow: hidden;
      flex: 0 0 auto;
    }

    .profile-pic .fruit-art,
    .profile-pic .space-art,
    .profile-pic .summer-art,
    .profile-pic .medieval-art,
    .profile-pic .emoji-art {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .message .profile-pic {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: inline-grid;
      vertical-align: middle;
      margin-right: 6px;
    }

    .message .profile-pic .fruit-art,
    .message .profile-pic .space-art,
    .message .profile-pic .summer-art,
    .message .profile-pic .medieval-art,
    .message .profile-pic .emoji-art {
      width: 20px;
      height: 20px;
      border-radius: 6px;
    }

    .profile-pic.large {
      width: 86px;
      height: 86px;
      border-radius: 16px;
    }

    .profile-pic.large .fruit-art,
    .profile-pic.large .space-art,
    .profile-pic.large .summer-art,
    .profile-pic.large .medieval-art,
    .profile-pic.large .emoji-art {
      width: 70px;
      height: 70px;
      border-radius: 14px;
    }

    .fruit-art {
      --fruit-main: #ff3045;
      --fruit-mid: #ef1f36;
      --fruit-dark: #b90d22;
      --fruit-leaf: #57d665;
      --fruit-stem: #a26319;
      width: 42px;
      height: 42px;
      position: relative;
      display: inline-block;
      flex: 0 0 auto;
      filter: drop-shadow(0 7px 8px rgba(0,0,0,.28));
    }

    .fruit-art.small {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 4px 5px rgba(0,0,0,.22));
    }

    .fruit-art.large {
      width: 110px;
      height: 110px;
      filter: drop-shadow(0 18px 20px rgba(0,0,0,.32));
    }

    .pack-icon .fruit-art {
      width: 30px;
      height: 30px;
      margin: -3px;
    }

    .pack-showcase .fruit-art {
      width: 32px;
      height: 32px;
      margin: 0;
    }

    .fruit-core, .fruit-detail, .fruit-stem, .fruit-leaf {
      position: absolute;
      display: block;
    }

    .fruit-core {
      inset: 12% 7% 7%;
      border-radius: 24% 24% 18% 18%;
      background:
        radial-gradient(circle at 68% 24%, rgba(255,255,255,.25), transparent 13%),
        linear-gradient(135deg, var(--fruit-main), var(--fruit-mid) 55%, var(--fruit-dark));
      box-shadow: inset 0 -5px 0 rgba(0,0,0,.12), inset 0 4px 0 rgba(255,255,255,.12);
    }

    .fruit-stem {
      width: 11%;
      height: 31%;
      left: 51%;
      top: 1%;
      border-radius: 999px;
      background: var(--fruit-stem);
      transform: rotate(9deg);
      z-index: 3;
    }

    .fruit-leaf {
      width: 34%;
      height: 20%;
      left: 25%;
      top: 8%;
      border-radius: 90% 10% 90% 10%;
      background: linear-gradient(135deg, #6df576, var(--fruit-leaf));
      transform: rotate(22deg);
      z-index: 4;
    }

    .fruit-apple { --fruit-main:#ff3850; --fruit-mid:#f20d28; --fruit-dark:#9d0017; }
    .fruit-orange { --fruit-main:#ff9d1b; --fruit-mid:#ff7800; --fruit-dark:#b94700; }
    .fruit-lemon { --fruit-main:#fff176; --fruit-mid:#ffe24a; --fruit-dark:#caa51a; }
    .fruit-lime { --fruit-main:#b7eb6a; --fruit-mid:#8fce42; --fruit-dark:#5d9124; }
    .fruit-green-apple { --fruit-main:#8cdf42; --fruit-mid:#6fc736; --fruit-dark:#3f8e22; }

    .fruit-grape .fruit-core,
    .fruit-raspberry .fruit-core,
    .fruit-blue-raspberry .fruit-core {
      inset: 4% 8% 4%;
      border-radius: 0;
      background:

      top: 32%;
      width: 62%;
      height: 49%;
      border-radius: 18% 18% 23% 23%;
      background:
        radial-gradient(circle at 20% 76%, #ff89cf 0 6%, transparent 7%),
        radial-gradient(circle at 80% 76%, #31d6c8 0 6%, transparent 7%),
        radial-gradient(circle at 50% 87%, #ffffff 0 4%, transparent 5%),
        linear-gradient(135deg, #fffdf1, #ffd25f 47%, #ff8f53);
      border: 3px solid #31d6c8;
      box-shadow:
        -11px 8px 0 -6px #ff89cf,
        11px 8px 0 -6px #31d6c8,
        inset 0 -5px 0 rgba(0,0,0,.18);
    }

    .summer-art.summer-astronaut .summer-core::before {
      content: "";
      position: absolute;
      inset: 10% 10% 33%;
      border-radius: 18%;
      background:
        radial-gradient(circle at 34% 56%, #14213b 0 5%, transparent 6%),
        radial-gradient(circle at 66% 56%, #14213b 0 5%, transparent 6%),
        radial-gradient(circle at 23% 22%, rgba(255,255,255,.95) 0 7%, transparent 8%),
        linear-gradient(135deg, rgba(226,253,255,.96), rgba(91,214,255,.7) 55%, rgba(18,38,74,.5));
      border: 1px solid rgba(255,255,255,.72);
    }

    .summer-art.summer-astronaut .summer-detail {
      left: 23%;
      top: 14%;
      width: 54%;
      height: 24%;
      border-radius: 999px 999px 26% 26%;
      background: linear-gradient(135deg, #ff89cf, #31d6c8);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
    }

    @keyframes summerGlow {
      0%, 100% { transform: scale(.96); filter: brightness(1); }
      50% { transform: scale(1.04); filter: brightness(1.2); }
    }

    .chatlog, .tradelog {
      height: 430px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: #090d14;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .message {
      padding: 9px 10px;
      border-radius: 8px;
      background: #121925;
      border: 1px solid #1e2a3b;
      overflow-wrap: anywhere;
      max-width: min(78%, 620px);
      align-self: flex-start;
    }

    .message.own {
      align-self: flex-end;
      background: #10231f;
      border-color: #28584d;
    }

    .message.system {
      align-self: center;
      max-width: 92%;
      background: #101722;
      border-style: dashed;
    }

    .message .name { font-weight: 800; }
    .message .admin { color: #ff6f61; font-size: 11px; margin-left: 5px; }

    .statgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      padding: 14px;
    }

    .stat span { color: var(--muted); display: block; font-size: 12px; }
    .stat strong { display: block; font-size: 28px; margin-top: 4px; }

    .wheel-wrap {
      display: grid;
      place-items: center;
      gap: 14px;
      padding: 18px;
    }

    .wheel {
      position: relative;
      width: min(72vw, 340px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: conic-gradient(
        #21d19f 0 51.42deg,
        #5aa7ff 51.42deg 102.84deg,
        #c88cff 102.84deg 154.26deg,
        #ffd36b 154.26deg 205.68deg,
        #ff89cf 205.68deg 257.1deg,
        #ff6f61 257.1deg 308.52deg,
        #70fff4 308.52deg 360deg
      );
      border: 10px solid #121925;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      transition: transform 3.2s cubic-bezier(.16, .84, .22, 1);
    }

    .wheel::after {
      content: "";
      position: absolute;
      inset: 30%;
      border-radius: 50%;
      background: #0d121b;
      border: 1px solid rgba(255,255,255,.18);
    }

    .slice-label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: rotate(var(--a)) translateY(-138px) rotate(calc(-1 * var(--a)));
      transform-origin: center;
      color: #05070a;
      font-weight: 900;
      font-size: 13px;
      z-index: 2;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 28px solid var(--text);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
      margin-bottom: -24px;
      z-index: 3;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.72);
      z-index: 20;
      padding: 18px;
    }

    .modal-inner {
      width: min(660px, 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #101722;
      padding: 18px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
      text-align: center;
      position: relative;
    }

    .modal-close {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 34px;
      min-height: 34px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    .opening-stage {
      min-height: 390px;
      display: grid;
      place-items: center;
      overflow: visible;
      position: relative;
      isolation: isolate;
    }

    .opening-stage::before {
      content: "";
      position: absolute;
      inset: 8% 10%;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(255,255,255,.2), transparent 42%),
        radial-gradient(circle, rgba(112,255,244,.13), transparent 58%);
      transform: scale(.8);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    .opening-stage.bloom::before {
      animation: stageBloom 1.2s ease forwards;
    }

    .opening-stage.epic-plus::after {
      content: "";
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      z-index: 2;
    }

    .opening-stage.rarity-epic::after {
      background:
        radial-gradient(circle at 28% 26%, #f0ddff 0 1.8%, transparent 2.3%),
        radial-gradient(circle at 72% 28%, #c88cff 0 2%, transparent 2.5%),
        radial-gradient(circle at 24% 76%, #c88cff 0 1.7%, transparent 2.2%),
        radial-gradient(circle at 78% 74%, #f0ddff 0 1.7%, transparent 2.2%),
        radial-gradient(circle, transparent 38%, rgba(200,140,255,.3), transparent 62%);
      animation: epicSparkle 1.8s ease-out forwards;
    }

    .opening-stage.rarity-legendary::after {
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.8) 0 2%, transparent 3%),
        radial-gradient(circle, rgba(255,241,181,.5), transparent 36%),
        conic-gradient(from 8deg, transparent 0 6%, rgba(255,211,107,.88) 6% 9%, transparent 9% 16%, rgba(255,241,181,.78) 16% 19%, transparent 19% 26%, rgba(255,211,107,.72) 26% 29%, transparent 29% 100%),
        radial-gradient(circle, rgba(255,211,107,.34), transparent 60%);
      animation: legendaryRays 2.35s ease-out forwards;
    }

    .opening-stage.rarity-chroma::after {
      background:
        conic-gradient(from 0deg, #70fff4, #5aa7ff, #c88cff, #ff89cf, #ffd36b, #70fff4);
      mix-blend-mode: screen;
      animation: chromaWheel 2.15s ease-out forwards;
    }

    .opening-stage.rarity-supreme::after {
      background:
        radial-gradient(circle, rgba(255,137,207,.55), transparent 38%),
        conic-gradient(from 0deg, transparent, rgba(255,137,207,.8), rgba(112,255,244,.7), transparent, rgba(255,211,107,.65), transparent);
      mix-blend-mode: screen;
      animation: supremePulse 2.15s ease-out forwards;
    }

    .opening-stage.rarity-mythic::after {
      background:
        radial-gradient(circle, transparent 18%, rgba(255,211,107,.92) 20% 23%, transparent 24%),
        radial-gradient(circle, transparent 31%, rgba(255,111,97,.88) 33% 38%, transparent 40%),
        conic-gradient(from 0deg, transparent, rgba(255,211,107,.85), transparent, rgba(255,111,97,.95), transparent, rgba(255,137,207,.75), transparent);
      mix-blend-mode: screen;
      animation: mythicShock 3.2s ease-out forwards;
    }

    .opening-stage.rarity-mythic .opening-ring {
      border-color: rgba(255,211,107,.62);
      box-shadow:
        0 0 80px rgba(255,111,97,.5),
        0 0 140px rgba(255,211,107,.3);
      animation: mythicRing 1.1s ease-in-out infinite;
    }

    .mythic-banner {
      position: absolute;
      top: 18px;
      left: 50%;
      z-index: 8;
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,211,107,.75);
      background:
        linear-gradient(90deg, rgba(255,111,97,.92), rgba(255,211,107,.95), rgba(255,137,207,.92));
      color: #26060a;
      font-size: 20px;
      font-weight: 1000;
      letter-spacing: 2px;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
      box-shadow: 0 0 30px rgba(255,111,97,.55), 0 14px 35px rgba(0,0,0,.34);
      opacity: 0;
      transform: translateX(-50%) translateY(-28px) scale(.45);
      pointer-events: none;
    }

    .mythic-banner.show {
      animation: mythicBannerPop 2.4s cubic-bezier(.15,.98,.2,1.12) forwards;
    }

    .opening-pack {
      width: 184px;
      height: 184px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      font-size: 88px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.22), transparent 22% 72%, rgba(0,0,0,.2)),
        linear-gradient(135deg, var(--c1), var(--c2));
      animation: packIdle 1.2s ease-in-out infinite;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.22),
        inset 0 -12px 0 rgba(0,0,0,.16),
        0 22px 70px rgba(0,0,0,.42);
      position: relative;
      z-index: 3;
      overflow: hidden;
    }

    .opening-pack::before {
      content: "";
      position: absolute;
      inset: -55%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.4), transparent 34%),
        linear-gradient(135deg, transparent 20%, rgba(255,255,255,.35), transparent 72%);
      animation: chargeGlow .55s ease-in-out infinite;
      opacity: .65;
    }

    .opening-pack > * {
      position: relative;
      z-index: 2;
      transform: scale(1.14);
    }

    .opening-pack::after {
      content: "";
      position: absolute;
      left: 14%;
      right: 14%;
      top: 16%;
      height: 12%;
      border-radius: 999px;
      background: rgba(255,255,255,.28);
      box-shadow: 0 72px 0 -7px rgba(0,0,0,.12);
      z-index: 1;
    }

    .opening-pack.charge {
      animation: packCharge .36s cubic-bezier(.2,.8,.2,1) infinite;
    }

    .opening-pack.burst {
      animation: packBurst .3s ease forwards;
    }

    .opening-ring {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.28);
      box-shadow: 0 0 55px rgba(90,167,255,.28);
      animation: ringPulse .48s ease-in-out infinite;
      z-index: 1;
    }

    .opening-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,.85), rgba(255,255,255,.18) 24%, transparent 58%);
      opacity: 0;
      pointer-events: none;
      z-index: 4;
    }

    .opening-flash.on {
      animation: flashPop .45s ease forwards;
    }

    .opening-flash.mythic-on {
      background:
        radial-gradient(circle, rgba(255,244,214,.95), rgba(255,111,97,.45) 22%, rgba(255,137,207,.22) 42%, transparent 64%);
      animation: mythicFlash 1.35s ease forwards;
    }

    #confettiLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .confetti-piece {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--cw, 9px);
      height: var(--ch, 15px);
      border-radius: 2px;
      background: var(--confetti);
      transform: translate(-50%, -50%) rotate(var(--rot));
      animation: confettiBurst 4.6s cubic-bezier(.16,.9,.2,1) forwards;
      animation-delay: var(--delay);
    }

    .opening-result-card {
      opacity: 0;
      transform: translateY(26px) scale(.68);
      position: relative;
      z-index: 6;
      width: min(360px, 92vw);
      margin: 0 auto;
    }

    .opening-result-card.show {
      animation: resultPop .5s cubic-bezier(.16,1.08,.28,1.18) forwards;
    }

    .opening-result-card.show.rarity-epic {
      animation: fallForwardReveal .68s cubic-bezier(.14,.88,.18,1.18) forwards;
    }

    .opening-result-card.show.rarity-legendary {
      animation: legendaryForwardReveal 1.15s cubic-bezier(.14,.88,.18,1.12) forwards;
    }

    .opening-result-card.show.rarity-chroma,
    .opening-result-card.show.rarity-supreme {
      animation: spinCenterReveal .88s linear forwards;
    }

    .opening-result-card.show.rarity-mythic {
      animation: mythicReveal 1.18s linear forwards;
    }

    .opening-result-card.fast-open {
      cursor: pointer;
    }

    .opening-result-card.fast-open::after {
      content: "Click to open another";
      position: absolute;
      left: 50%;
      bottom: -34px;
      transform: translateX(-50%);
      white-space: nowrap;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .opening-result-card.shiny {
      filter: drop-shadow(0 0 22px var(--shine));
    }

    .opening-result-card.rarity-epic {
      filter: drop-shadow(0 0 16px rgba(200,140,255,.72));
    }

    .opening-result-card.rarity-legendary {
      filter: drop-shadow(0 0 18px rgba(255,211,107,.78));
    }

    .opening-result-card.rarity-mythic {
      filter:
        drop-shadow(0 0 34px rgba(255,111,97,.92))
        drop-shadow(0 0 22px rgba(255,211,107,.82));
    }

    .opening-result-card.shiny::before {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 18px;
      background: conic-gradient(from 0deg, transparent, var(--shine), transparent, rgba(255,255,255,.45), transparent);
      animation: shineSpin 1.35s linear infinite;
      z-index: -1;
      opacity: .55;
    }

    .opening-result-card.rarity-mythic::before {
      background:
        conic-gradient(from 0deg, rgba(255,111,97,.1), #ffd36b, #ff6f61, #ff89cf, #ffd36b, rgba(255,111,97,.1));
      animation: mythicHaloSpin .8s linear infinite;
      opacity: .78;
      inset: -24px;
    }

    .opening-result-card.rarity-epic::before,
    .opening-result-card.rarity-legendary::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 18% 24%, var(--shine) 0 4%, transparent 5%),
        radial-gradient(circle at 82% 26%, rgba(255,255,255,.75) 0 3%, transparent 4%),
        radial-gradient(circle at 72% 82%, var(--shine) 0 4%, transparent 5%),
        radial-gradient(circle at 24% 78%, rgba(255,255,255,.7) 0 3%, transparent 4%);
      animation: sparkleHalo 1.45s ease-in-out infinite;
      z-index: -1;
      opacity: .58;
    }

    .opening-result-card .blook {
      min-height: 278px;
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 18px 16px 16px;
      background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.18), transparent 28%),
        linear-gradient(180deg, #141e2c, #0b101a);
      border-color: var(--shine, var(--line));
      border-radius: 14px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.12),
        0 16px 48px rgba(0,0,0,.42);
    }

    .opening-result-card .blookface {
      width: 164px;
      height: 164px;
      border-radius: 18px;
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.2),
        0 12px 24px rgba(0,0,0,.3);
    }

    .opening-result-card .fruit-art,
    .opening-result-card .space-art,
    .opening-result-card .summer-art,
    .opening-result-card .medieval-art,
    .opening-result-card .emoji-art {
      width: 138px;
      height: 138px;
      border-radius: 22px;
    }

    .opening-result-card strong {
      font-size: 24px;
      max-width: 300px;
    }

    @keyframes packIdle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.04); }
    }

    @keyframes stageBloom {
      0% { opacity: 0; transform: scale(.3); }
      24% { opacity: .85; transform: scale(1.08); }
      100% { opacity: 0; transform: scale(1.55); }
    }

    @keyframes chargeGlow {
      0%, 100% { opacity: .42; transform: scale(.96); }
      50% { opacity: .82; transform: scale(1.08); }
    }

    @keyframes packCharge {
      0%, 100% { transform: translateY(0) scale(1.04); box-shadow: inset 0 0 0 2px rgba(255,255,255,.22), inset 0 -12px 0 rgba(0,0,0,.16), 0 22px 70px rgba(0,0,0,.42), 0 0 18px rgba(255,255,255,.18); }
      35% { transform: translate(-5px, -3px) scale(1.1); }
      70% { transform: translate(5px, -1px) scale(1.08); box-shadow: inset 0 0 0 2px rgba(255,255,255,.22), inset 0 -12px 0 rgba(0,0,0,.16), 0 22px 70px rgba(0,0,0,.42), 0 0 48px rgba(255,255,255,.52); }
    }

    @keyframes packBurst {
      0% { transform: scale(1.12); opacity: 1; }
      55% { transform: scale(1.5); opacity: .95; }
      100% { transform: scale(.18); opacity: 0; }
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(.9); opacity: .45; }
      50% { transform: scale(1.18); opacity: .9; }
    }

    @keyframes flashPop {
      0% { opacity: 0; transform: scale(.65); }
      35% { opacity: .95; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.28); }
    }

    @keyframes mythicFlash {
      0% { opacity: 0; transform: scale(.4); }
      18% { opacity: 1; transform: scale(1); }
      42% { opacity: .62; transform: scale(1.18); }
      100% { opacity: 0; transform: scale(1.65); }
    }

    @keyframes confettiBurst {
      0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scale(.4); }
      8% { opacity: 1; }
      62% { opacity: 1; }
      100% { opacity: .72; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(calc(var(--rot) + 180deg)) scale(.92); }
    }

    @keyframes resultPop {
      0% { opacity: 0; transform: translateY(30px) scale(.58); }
      64% { opacity: 1; transform: translateY(-8px) scale(1.08); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fallForwardReveal {
      0% { opacity: 0; transform: translateY(-160px) scale(.22); filter: blur(6px); }
      44% { opacity: 1; transform: translateY(18px) scale(.82); filter: blur(0); }
      72% { opacity: 1; transform: translateY(-8px) scale(1.08); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes legendaryForwardReveal {
      0% { opacity: 0; transform: translateY(-190px) scale(.16) rotate(-8deg); filter: blur(8px) brightness(1.25); }
      32% { opacity: 1; transform: translateY(24px) scale(.78) rotate(4deg); filter: blur(1px) brightness(1.18); }
      60% { opacity: 1; transform: translateY(-12px) scale(1.12) rotate(-2deg); filter: blur(0) brightness(1.08); }
      78% { transform: translateY(5px) scale(.98) rotate(1deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); filter: brightness(1); }
    }

    @keyframes spinCenterReveal {
      0% { opacity: 0; transform: scale(.06) rotate(-1080deg); filter: blur(8px); }
      25% { opacity: .55; transform: scale(.34) rotate(-810deg); filter: blur(5px); }
      50% { opacity: 1; transform: scale(.68) rotate(-540deg); filter: blur(2px); }
      75% { opacity: 1; transform: scale(1.06) rotate(-270deg); filter: blur(0); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
    }

    @keyframes mythicReveal {
      0% { opacity: 0; transform: scale(.02) rotate(-1440deg); filter: blur(12px) brightness(1.8); }
      20% { opacity: .72; transform: scale(.32) rotate(-1152deg); filter: blur(7px) brightness(1.65); }
      40% { opacity: 1; transform: scale(.62) rotate(-864deg); filter: blur(4px) brightness(1.48); }
      60% { opacity: 1; transform: scale(.92) rotate(-576deg); filter: blur(1px) brightness(1.32); }
      80% { opacity: 1; transform: scale(1.18) rotate(-288deg); filter: blur(0) brightness(1.18); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); filter: brightness(1); }
    }

    @keyframes epicSparkle {
      0% { opacity: 0; transform: scale(.45) rotate(0deg); filter: blur(2px); }
      24% { opacity: .95; filter: blur(0); }
      100% { opacity: 0; transform: scale(1.45) rotate(34deg); }
    }

    @keyframes legendaryRays {
      0% { opacity: 0; transform: scale(.22) rotate(-28deg); filter: blur(4px); }
      18% { opacity: 1; filter: blur(0); }
      48% { opacity: .86; transform: scale(1.08) rotate(8deg); }
      74% { opacity: .44; transform: scale(1.46) rotate(24deg); filter: blur(2px); }
      100% { opacity: 0; transform: scale(1.88) rotate(42deg); filter: blur(7px); }
    }

    @keyframes chromaWheel {
      0% { opacity: 0; transform: scale(.25) rotate(0deg); filter: blur(8px); }
      24% { opacity: .72; filter: blur(2px); }
      100% { opacity: 0; transform: scale(1.7) rotate(240deg); filter: blur(10px); }
    }

    @keyframes supremePulse {
      0% { opacity: 0; transform: scale(.3) rotate(0deg); filter: blur(6px); }
      20% { opacity: .86; filter: blur(1px); }
      48% { opacity: .72; transform: scale(1.06) rotate(55deg); }
      100% { opacity: 0; transform: scale(1.8) rotate(120deg); filter: blur(8px); }
    }

    @keyframes mythicShock {
      0% { opacity: 0; transform: scale(.12) rotate(-80deg); filter: blur(9px); }
      16% { opacity: 1; filter: blur(1px); }
      38% { opacity: .92; transform: scale(1.18) rotate(28deg); }
      68% { opacity: .58; transform: scale(1.62) rotate(88deg); filter: blur(4px); }
      100% { opacity: 0; transform: scale(2.25) rotate(160deg); filter: blur(10px); }
    }

    @keyframes mythicRing {
      0%, 100% { transform: scale(.82); opacity: .42; }

        if (!user) {
          user = {
            id: id(),
            email: bot.email,
            password: "bot",
            name: bot.name,
            tokens: bot.tokens,
            totalTokens: bot.tokens,
            messages: bot.messages,
            packOpens: bot.packOpens,
            pings: 0,
            xp: bot.xp,
            muted: false,
            banned: false,
            plus: false,
            admin: false,
            badge: "BOT",
            nameColor: bot.paint,
            textColor: "#eef4ff",
            paint: "",
            inventory: [],
            boosterUntil: 0,
            lastWheel: "",
            bot: true
          };
          savedState.users.push(user);
        }
        user.bot = true;
        user.password ||= "bot";
        user.tokens ??= bot.tokens;
        user.totalTokens ??= Math.max(user.tokens || 0, bot.tokens);
        user.messages ??= bot.messages;
        user.packOpens ??= bot.packOpens;
        user.pings ??= 0;
        user.xp ??= bot.xp;
        user.nameColor ||= bot.paint;
        user.textColor ||= "#eef4ff";
        user.inventory ||= [];
        seedBotInventory(user, bot.blooks);
        botByName[bot.name] = user;
      });

      const fakeClans = [
        { name: "Nebula", paint: "#5aa7ff", owner: "nova_bot", members: ["nova_bot", "debug_bot"], xp: 16200 },
        { name: "Orchard", paint: "#21d19f", owner: "orchard_bot", members: ["orchard_bot", "lucky_bot"], xp: 11800 },
        { name: "Tide", paint: "#31d6c8", owner: "tide_bot", members: ["tide_bot"], xp: 7600 }
      ];
      fakeClans.forEach(info => {
        let clan = savedState.clans.find(c => c.name === info.name && c.bot);
        const members = info.members.map(name => botByName[name]?.id).filter(Boolean);
        if (!clan) {
          clan = { id: id(), name: info.name, ownerId: botByName[info.owner]?.id || members[0], members, applications: [], paint: info.paint, xp: info.xp, bot: true };
          savedState.clans.push(clan);
        }
        clan.bot = true;
        clan.members = Array.from(new Set([...(clan.members || []), ...members]));
        clan.ownerId ||= botByName[info.owner]?.id || clan.members[0];
        clan.applications ||= [];
        clan.paint ||= info.paint;
        clan.xp ??= info.xp;
        clan.roles ||= {};
        clan.roles[clan.ownerId] = "owner";
        clan.members.forEach(memberId => clan.roles[memberId] ||= memberId === clan.ownerId ? "owner" : "member");
        clan.contributors ||= {};
        clan.members.forEach((memberId, index) => clan.contributors[memberId] ||= Math.max(400, Math.round((clan.xp || 0) / (index + 2))));
        clan.rewardClaims ||= {};
        clan.boosterUntil ||= 0;
      });
      const activeBotListings = savedState.listings.filter(listing => !listing.sold && savedState.users.find(user => user.id === listing.sellerId)?.bot).length;
      if (activeBotListings < 5) {
        const seeds = [
          ["nova_bot", "Spaceship"],
          ["orchard_bot", "Starfruit"],
          ["tide_bot", "Surfboard"],
          ["debug_bot", "Space Terminal"],
          ["lucky_bot", "Sun"]
        ];
        seeds.slice(0, 5 - activeBotListings).forEach(([botName, itemName]) => {
          const bot = botByName[botName];
          if (!bot) return;
          const item = { ...canonicalBlook(blookTemplate(itemName)), uid: id(), source: "bot bazaar listing", openedAt: Date.now() };
          savedState.listings.push({ id: id(), sellerId: bot.id, item, price: botListingPrice(item, savedState.listings), sold: false, time: Date.now(), botListed: true });
        });
      }
      return savedState;
    }

    function loadState() {
      const saved = localStorage.getItem(STORE_KEY);
      if (!saved) return seedState();
      try {
        const parsed = JSON.parse(saved);
        if (!parsed.users?.length) return seedState();
        return ensureSeededAccounts(parsed);
      } catch {
        return seedState();
      }
    }

    function saveState(broadcast = true) {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      if (broadcast && channel) channel.postMessage({ type: "state", state });
      if (broadcast && SERVER_MODE) {
        const headers = { "Content-Type": "application/json" };
        const adminToken = localStorage.getItem("packlet_admin_token");
        if (adminToken) headers["X-Packlet-Admin-Token"] = adminToken;
        fetch("/api/state", {
          method: "POST",
          headers,
          body: JSON.stringify(state)
        }).catch(() => toast("Server save failed. Is Packlet server still running?"));
      }
    }

    async function loadRemoteState() {
      if (!SERVER_MODE) return;
      try {
        const response = await fetch("/api/state");
        const remote = await response.json();
        if (remote?.users?.length) {
          state = ensureSeededAccounts(remote);
          localStorage.setItem(STORE_KEY, JSON.stringify(state));
        } else {
          await fetch("/api/state", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(state)
          });
        }
        render();
        startServerEvents();
      } catch {
        toast("Could not connect to the shared Packlet server.");
      }
    }

    function startServerEvents() {
      if (!SERVER_MODE || !("EventSource" in window)) return;
      const events = new EventSource("/api/events");
      events.onmessage = event => {
        try {
          const remote = JSON.parse(event.data);
          if (remote?.users?.length) {
            state = ensureSeededAccounts(remote);
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
            render();
          }
        } catch {}
      };
    }

    if (channel) {
      channel.onmessage = event => {
        if (event.data?.type === "state") {
          state = ensureSeededAccounts(event.data.state);
          render();
        }
      };
    }

    function id() {
      return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    function todayKey() {
      return new Date().toISOString().slice(0, 10);
    }

    function normalizeLogin(value) {
      return String(value || "").trim().toLowerCase();
    }

    function userByLogin(login) {
      const normalized = normalizeLogin(login);
      return state.users.find(user =>
        normalizeLogin(user.email) === normalized ||
        normalizeLogin(user.name) === normalized
      ) || null;
    }

    function currentUser() {
      return userByLogin(sessionEmail);
    }

    function isPlus(user) {
      return !!(user?.plus || user?.admin);
    }

    function clanFor(userId) {
      return state.clans.find(c => c.members.includes(userId)) || null;
    }

    function clanRole(clan, userId) {
      if (!clan || !userId) return "";
      if (clan.ownerId === userId) return "owner";
      return clan.roles?.[userId] || "member";
    }

    function canManageClan(clan, userId) {
      return ["owner", "co-owner", "officer"].includes(clanRole(clan, userId));
    }

    function clanTopContributor(clan) {
      const entries = Object.entries(clan?.contributors || {});
      if (!entries.length) return null;
      const [userId, amount] = entries.sort((a, b) => b[1] - a[1])[0];
      return { user: userById(userId), amount };
    }

    function clanMilestones(clan) {
      const level = clanLevelFor(clan);
      const milestones = [];
      for (let value = 5; value <= level; value += 5) milestones.push(value);
      return milestones;
    }

    function addClanXp(clan, userId, amount) {
      if (!clan || !amount) return;
      clan.xp = (clan.xp || 0) + amount;
      clan.contributors ||= {};
      clan.contributors[userId] = (clan.contributors[userId] || 0) + amount;
    }

    function acceptClanMember(clan, applicantId) {
      if (!clan || !applicantId) return false;
      if (clan.members.includes(applicantId)) return true;
      if (clanFor(applicantId)) return false;
      if ((clan.members || []).length >= 50) return false;
      clan.members.push(applicantId);
      clan.applications = (clan.applications || []).filter(id => id !== applicantId);
      clan.roles ||= {};
      clan.roles[applicantId] ||= "member";
      clan.contributors ||= {};
      clan.contributors[applicantId] ||= 0;
      state.clanChats ||= [];
      state.clanChats.push({ id: id(), clanId: clan.id, system: true, text: `${userById(applicantId)?.name || "A player"} joined the clan.`, time: Date.now() });
      return true;
    }

    function botUsers() {
      return state.users.filter(user => user.bot && !user.banned);
    }

    function randomBot() {
      const bots = botUsers();
      return bots[Math.floor(Math.random() * bots.length)] || null;
    }

    function recentHumanChat() {
      return [...state.chats].reverse().find(message => message.userId && !message.bot && !userById(message.userId)?.bot) || null;
    }

    function chooseBotLine(lines) {
      state.recentBotLines ||= [];
      state.recentBotKeys ||= [];
      const keyFor = line => line.toLowerCase()
        .replace(/[^\w\s]/g, "")
        .replace(/\b(you|u|me|my|i|rn|the|a|an|is|are|to|for|it)\b/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 28);
      const choices = lines.filter(line => !state.recentBotLines.includes(line) && !state.recentBotKeys.includes(keyFor(line)));
      const pool = choices.length ? choices : lines;
      const line = pool[Math.floor(Math.random() * pool.length)];
      state.recentBotLines = [...state.recentBotLines, line].slice(-10);
      state.recentBotKeys = [...state.recentBotKeys, keyFor(line)].slice(-10);
      return line;
    }

    function chooseBotTopic(topic, lines, fallback = []) {
      state.recentBotTopics ||= [];
      const options = state.recentBotTopics.includes(topic) && fallback.length ? fallback : lines;
      const line = chooseBotLine(options);
      state.recentBotTopics = [...state.recentBotTopics, topic].slice(-4);
      return line;
    }

    function mentionedBlook(text) {
      const lower = text.toLowerCase();
      const found = packs.flatMap(pack => pack.blooks).find(item => lower.includes(item.name.toLowerCase()));
      return found || null;
    }

    function hasAny(text, words) {
      return words.some(word => text.includes(word));
    }

    function botChatLine(trigger = "", bot = null) {
      const recent = trigger ? null : recentHumanChat();
      const recentUser = recent ? userById(recent.userId) : null;
      const source = trigger || recent?.text || "";
      const lower = source.toLowerCase();
      const name = recentUser?.name || "you";
      const pick = chooseBotLine;
      const pull = mentionedBlook(source);
      if ((lower.includes("pulled") || lower.includes("got") || lower.includes("opened")) && pull) {
        const rare = ["legendary", "chroma", "supreme", "mythic"].includes(pull.rarity);
        return pick(rare
          ? [`${name}, ${pull.name} is a crazy pull`, `dont rawsell ${pull.name}, that one can move`, `${pull.name} is exactly the kind of thing people overpay for`, `nice pull, ${name}. i would check bazaar before trading it`]
          : [`${pull.name} is decent for filling collection`, `at least ${pull.name} adds to unlocks`, `${name}, keep one ${pull.name} and sell dupes`]);
      }
      if (hasAny(lower, ["hi", "hello", "hey", "yo", "sup"])) return pick(["yo", "hey", "what are we grinding today?", "u opening packs or bazaar hunting?"]);
      if (hasAny(lower, ["help", "what do i do", "what should i do", "idk what to do"])) return pick([`${name}, do daily wheel then open packs or check bazaar`, "if ur broke, sell dupes and spin wheel first", "join a clan before grinding packs so xp counts", "check lowest bazaar price before listing anything rare"]);
      if (hasAny(lower, ["should i", "do i ", "do u think", "do you think"])) return pick([`${name}, i would compare bazaar first`, "probably, but dont overpay unless u really want it", "if it is limited or rare, holding can be smarter", "if u need tokens now, sell dupes not your best blook"]);
      if (hasAny(lower, ["open ", "opening ", "spam "])) return pick(["use max if u have plus", "open with a booster if one is active", "expensive packs give better xp now", `${name}, stop if u hit something huge so u can flex it`]);
      if (hasAny(lower, ["buy my bazaar", "buy my listing", "buy from my bazaar", "buy my stuff"])) return chooseBotTopic("bazaar-buy", [
        "ill check if anything is priced fair",
        "if one listing makes sense, i might grab it",
        "drop it near fair and bots may buy",
        "i can look, but i skip wild prices"
      ], [
        "maybe, depends how it is priced",
        "i am not buying every listing automatically",
        "fair prices move way faster"
      ]);
      if (hasAny(lower, ["buy ", "purchase ", "worth buying"])) return pick(["only buy if it is near lowest listing", "if it is under fair value, grab it fast", "overpriced stuff can still sell later but its risky", "i would save some tokens for boosters too"]);
      if (hasAny(lower, ["sell ", "rawsell", "quick sell"])) return pick(["rawsell dupes, not your only copy", "bazaar is usually better than rawsell for rare stuff", "sell bad dupes first", `${name}, keep one of each for collection score`]);
      if (hasAny(lower, ["join ", "apply ", "invite"])) return pick(["apply to a bot clan if u want instant testing", "join a clan before opening expensive packs", "owners can accept applications on the clan page", "clan levels are slow but rewards are nice"]);
      if (hasAny(lower, ["list ", "price ", "undercut"])) return pick(["list just under cheapest if u want it to move", "round prices to clean hundreds, looks better", "bots buy more when prices are fair or low", "overpricing can work but it takes patience"]);
      if (lower.includes("trade")) return pick([`${name}, send me a trade and ill accept`, `i can trade rn, ${name}. what are u offering?`, "i might counter but ill accept fast", "trade system still needs polish but it works"]);
      if (lower.includes("summer")) return pick(["summer pack is expensive but the xp is finally worth it", `${name}, summer values might go up if the pack leaves`, "summer astronaut is the one id hold"]);
      if (lower.includes("fruit")) return pick(["fruit pack is lowkey a grind", "green apple and blue rasp are the main chase there", `${name}, fruit pack feels better with boosters`]);
      if (lower.includes("space")) return pick(["space pack has too many good chase blooks", "colored astronauts are hard to price ngl", `${name}, space terminal is one of my favorites`]);
      if (lower.includes("pack")) return pick([`${name}, i would open with a booster if u can`, "pack spam is way more fun now", "expensive packs should give way better clan xp now", "i usually stop when i hit a good pull"]);
      if (lower.includes("clan")) return pick([`${name}, clans are actually kinda carrying`, "my clan needs more contributors", "clan boosters feel worth it now", "top contributor rewards are kinda huge"]);
      if (lower.includes("bazaar") || lower.includes("list")) return chooseBotTopic("bazaar", [`${name}, i keep checking bazaar deals`, "if its fair price i might buy it", "undercutting is the whole game rn", "bots are starting to make the bazaar feel alive"], ["bazaar prices move fast", "lowest listing matters more than flex price", "clean prices look better"]);
      if (lower.includes("mythic") || lower.includes("supreme")) return pick([`${name}, that pull is crazy`, "save that, dont rawsell it", "value on that might go up", "i would flex that in chat"]);
      if (lower.includes("value") || lower.includes("worth")) return pick([`${name}, bazaar is usually a bit higher than trade value`, "depends if someone actually wants it", "i would check lowest listing first", "rare stuff changes fast when packs rotate"]);
      if (lower.includes("?")) return pick([`${name}, probably yeah`, "idk but i would test it", "maybe, depends on the price", "i think so but dont quote me"]);
      const lines = [
        "bazaar has a few decent prices rn",
        "i might undercut one of my listings",
        "saving tokens feels slower until a bot buys something",
        "i am watching summer prices more than fruit rn",
        "top contributor rewards are actually worth grinding",
        "i think bazaar is better than rawsell for rare stuff",
        "i need one lucky pull before i stop opening"
      ];
      return pick(lines);
    }

    function addBotChat(trigger = "", chance = 1) {
      if (Math.random() > chance) return false;
      if (Date.now() - (state.lastBotChatAt || 0) < 3500) return false;
      const bot = randomBot();
      if (!bot) return false;
      state.chats.push({ id: id(), userId: bot.id, text: botChatLine(trigger, bot), time: Date.now(), bot: true });
      bot.messages = (bot.messages || 0) + 1;
      state.lastBotChatAt = Date.now();
      return true;
    }

    function listingValueForBot(listing) {
      const guide = marketGuide[listing.item.name];
      if (guide) {
        const roll = Math.random();
        if (roll < 0.04) return guide.high * 1.8;
        if (roll < 0.16) return guide.high * 1.25;
        return guide.high;
      }
      return Math.max(rarityValues[listing.item.rarity] || 0, listingDefaultPrice(listing.item) * 1.35);
    }

    function botShouldBuyListing(listing) {
      const guide = marketGuide[listing.item.name];
      if (!guide) return listing.price <= listingValueForBot(listing);
      if (listing.price <= guide.low) return Math.random() < .9;
      if (listing.price <= guide.fair) return Math.random() < .72;
      if (listing.price <= guide.high) return Math.random() < .42;
      if (listing.price <= guide.high * 1.35) return Math.random() < .14;
      if (listing.price <= guide.high * 1.8) return Math.random() < .04;
      return false;
    }

    function botBuyBazaar(chance = 1) {
      if (Math.random() > chance) return false;
      if (Date.now() - (state.lastBotBazaarAt || 0) < 22000) return false;
      const listings = state.listings
        .filter(listing => !listing.sold)
        .filter(listing => botShouldBuyListing(listing))
        .sort((a, b) => a.price - b.price);
      if (!listings.length) return false;
      const listing = listings[Math.floor(Math.random() * Math.min(4, listings.length))];
      const buyers = botUsers().filter(bot => bot.id !== listing.sellerId && (bot.tokens || 0) >= listing.price);
      if (!buyers.length) return false;
      const bot = buyers[Math.floor(Math.random() * buyers.length)];
      const seller = userById(listing.sellerId);
      bot.tokens -= listing.price;
      if (seller) addTokens(seller, listing.price);
      bot.inventory ||= [];
      bot.inventory.push({ ...listing.item, source: "bot bazaar buy", boughtAt: Date.now() });
      listing.sold = true;
      listing.buyerId = bot.id;
      listing.botBought = true;
      if (!seller?.bot) listing.privateNotice = `${bot.name} bought ${listing.item.name} from your bazaar listing for ${money(listing.price)} tokens.`;
      state.lastBotBazaarAt = Date.now();
      return true;
    }

    function requestedBazaarBuy(user, text) {
      const lower = text.toLowerCase();
      if (!hasAny(lower, ["buy my bazaar", "buy my listing", "buy from my bazaar", "buy my stuff"])) return false;
      const listings = (state.listings || [])
        .filter(listing => !listing.sold && listing.sellerId === user.id)
        .filter(listing => {
          const guide = marketGuide[listing.item.name];
          if (guide) return listing.price <= guide.high * 1.12;
          const base = rarityValues[listing.item.rarity] || 100;
          return listing.price <= base * 4;
        })
        .sort((a, b) => a.price - b.price);
      const bot = randomBot();
      if (!bot) return false;
      if (!listings.length) {
        state.chats.push({ id: id(), userId: bot.id, text: "i checked, but your listings are too high for me rn", time: Date.now(), bot: true });
        bot.messages = (bot.messages || 0) + 1;
        return true;
      }
      const listing = listings[0];
      if ((bot.tokens || 0) < listing.price) return false;
      bot.tokens -= listing.price;
      addTokens(user, listing.price);
      bot.inventory ||= [];
      bot.inventory.push({ ...listing.item, source: "bot bazaar buy", boughtAt: Date.now() });
      listing.sold = true;
      listing.buyerId = bot.id;
      listing.botBought = true;
      listing.privateNotice = `${bot.name} bought ${listing.item.name} from your bazaar listing for ${money(listing.price)} tokens.`;
      state.chats.push({ id: id(), userId: bot.id, text: `i bought your ${listing.item.name} for ${money(listing.price)}`, time: Date.now(), bot: true });
      bot.messages = (bot.messages || 0) + 1;
      state.lastBotBazaarAt = Date.now();
      return true;
    }

    function roundedHundred(value) {
      return Math.max(100, Math.round(value / 100) * 100);
    }

    function botPriceRange(item) {
      const guide = marketGuide[item.name];
      const base = rarityValues[item.rarity] || 100;
      if (!guide) return { veryLow: base, low: base * 1.8, fair: base * 3, high: base * 5 };
      return guide;
    }

    function botListingPrice(item, listings) {
      if (!listings) {
        try { listings = state.listings || []; }
        catch { listings = []; }
      }
      const guide = botPriceRange(item);
      const floor = rarityValues[item.rarity] || 100;
      const veryLow = guide.veryLow || floor;
      const low = guide.low || veryLow * 1.35;
      const fair = guide.fair || low * 1.4;
      const high = guide.high || fair * 1.45;
      const roll = Math.random();
      let min = low;
      let max = fair;
      if (roll < .08) [min, max] = [floor, veryLow];
      else if (roll < .28) [min, max] = [veryLow, low];
      else if (roll < .76) [min, max] = [low, fair];
      else if (roll < .94) [min, max] = [fair, high];
      else [min, max] = [high, high * 1.75];
      let price = roundedHundred(min + Math.random() * Math.max(1, max - min));
      const cheapestSame = listings
        .filter(listing => !listing.sold && listing.item.name === item.name && listing.item.rarity === item.rarity)
        .reduce((lowest, listing) => Math.min(lowest, listing.price), Infinity);
      if (Number.isFinite(cheapestSame)) {
        price = Math.min(price, Math.max(100, Math.floor((cheapestSame - 1) / 100) * 100));
      }
      return Math.max(100, price);
    }

    function botListBazaar(chance = 1) {
      if (Math.random() > chance) return false;
      if (Date.now() - (state.lastBotListAt || 0) < 30000) return false;
      const bot = randomBot();
      if (!bot) return false;
      const activeBotListings = state.listings.filter(listing => !listing.sold && userById(listing.sellerId)?.bot).length;
      if (activeBotListings >= 12) return false;
      const botPool = ["Apple", "Orange", "Strawberry", "Starfruit", "Green Apple", "Blue Raspberry", "Meteor", "Stars", "UFO", "Spaceship", "Astronaut", "Space Terminal", "Sand Castle", "Surfboard", "Sun", "King", "Master Elf", "Wise Owl", "Agent Owl"];
      const name = botPool[Math.floor(Math.random() * botPool.length)];
      const item = { ...canonicalBlook(blookTemplate(name)), uid: id(), source: "bot bazaar listing", openedAt: Date.now() };
      const price = botListingPrice(item, state.listings);
      state.listings.push({ id: id(), sellerId: bot.id, item, price, sold: false, time: Date.now(), botListed: true });
      state.lastBotListAt = Date.now();
      if (Date.now() - (state.lastBotListChatAt || 0) > 90000 && Math.random() < 0.45) {
        state.chats.push({ id: id(), userId: bot.id, text: chooseBotLine([
          `i just listed ${item.name} for ${money(price)}`,
          `put a ${item.name} on bazaar`,
          `listed ${item.name}, curious if it moves`,
          `i put up a ${item.name} listing`
        ]), time: Date.now(), bot: true });
        bot.messages = (bot.messages || 0) + 1;
        state.lastBotListChatAt = Date.now();
      }
      return true;
    }

    function migrateStaleBotTrades() {
      state.trades ||= [];
      let changed = false;
      state.trades.forEach(trade => {
        const bot = userById(trade.toId)?.bot ? userById(trade.toId) : userById(trade.fromId)?.bot ? userById(trade.fromId) : null;
        if (bot && trade.status === "requested") {
          trade.status = "open";
          trade.chat ||= [];
          botRespondToTrade(trade);
          changed = true;
        }
      });
      return changed;
    }

    function cleanupCurrentUserMarketOnce() {
      if (SERVER_MODE) return false;
      const user = currentUser();
      if (!user) return false;
      const key = `packlet_cleanup_market_v1_${user.id}`;
      if (localStorage.getItem(key)) return false;
      let changed = false;
      state.listings.forEach(listing => {
        if (!listing.sold && listing.sellerId === user.id) {
          user.inventory.push(listing.item);
          listing.sold = true;
          listing.cancelled = true;
          changed = true;
        }
      });
      const before = state.trades.length;
      state.trades = state.trades.filter(trade => ![trade.fromId, trade.toId].includes(user.id) || trade.status === "completed");
      changed = changed || before !== state.trades.length;
      localStorage.setItem(key, "1");
      return changed;
    }

    function activeLuckBoost(user) {
      const globalBoost = Date.now() < (state.globalBoosterUntil || 0);
      const personal = Date.now() < (user?.boosterUntil || 0);
      const clan = user ? clanFor(user.id) : null;
      const clanBoost = Date.now() < (clan?.boosterUntil || 0);
      return { active: globalBoost || personal || clanBoost, globalBoost, personal, clanBoost, clan };
    }

    function playerLevelXpCost(level) {
      if (level < 5) return 25 + level * 7;
      if (level < 15) return 55 + (level - 5) * 8;
      if (level < 30) return 135 + (level - 15) * 5;
      if (level < 50) return 210 + (level - 30) * 9.5;
      if (level < 80) return 400 + (level - 50) * 6.5;
      if (level < 100) return 600 + (level - 80) * 12.5;
      return 850;
    }

    function levelFromXp(xp, costFn, multiplier = 1) {
      xp = Math.max(0, xp || 0);
      let level = 1;
      while (xp >= Math.round(costFn(level) * multiplier)) {
        xp -= Math.round(costFn(level) * multiplier);
        level++;
      }
      return level;
    }

    function levelFor(user) {
      return levelFromXp(user?.xp || 0, playerLevelXpCost);
    }

    function clanLevelFor(clan) {
      return levelFromXp(clan?.xp || 0, playerLevelXpCost, 5);
    }

    function addXp(user, amount) {
      user.xp = (user.xp || 0) + amount;
    }

    function addTokens(user, amount) {
      user.tokens += amount;
      user.totalTokens = (user.totalTokens || 0) + Math.max(0, amount);
    }

    function spendTokens(user, amount) {
      if (user.tokens < amount) return false;
      user.tokens -= amount;
      return true;
    }

    function toast(message) {
      const wrap = document.getElementById("toast");
      const item = document.createElement("div");

    function itemClass(item) {
      return String(item.name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

      const found = packs.flatMap(pack => pack.blooks.map(blook => ({ ...blook, packName: pack.name, packId: pack.id })))

      return found ? {

        source: item.source,
        openedAt: item.openedAt,
        boughtAt: item.boughtAt,

        icon: found.icon || item.icon,

      return user.inventory.map(canonicalBlook).filter(item => {

          <span class="space-core"></span>
          <span class="space-detail"></span>

        return `<span class="summer-art ${itemClass(item)} ${size}" aria-hidden="true">
          <span class="summer-core"></span>
          <span class="summer-detail"></span>
        </span>`;
      }
      if (item.visual === "medieval") {
        return medievalVisual(item, size);
      }
      if (item.visual === "emoji") {
        return `<span class="emoji-art ${size}" style="${cssRarity(item.rarity)}" aria-hidden="true">${item.icon}</span>`;

      return fruitVisual(item, size);

        medieval: ["Elf", "Witch", "Jester", "Dragon", "King", "Master Elf", "Dark Dragon"]
      };
      const featured = featuredByPack[pack.id] || pack.blooks.map(item => item.name);
      const items = featured.map(name => pack.blooks.find(item => item.name === name)).filter(Boolean);
      const center = items[items.length - 1] || pack.blooks[0];
      const outer = items.slice(0, -1);
      return `<div class="pack-showcase pack-${pack.id}">

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));

      return Number(n || 0).toLocaleString();
