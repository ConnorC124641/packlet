    function formatChance(value) {
      return `${Number(value).toFixed(3).replace(/\.?0+$/, "")}%`;
    }

    function weightedOdds(pack, boosted) {
      const raw = pack.blooks.map(item => ({
        ...item,
        targetWeight: boosted && item.boostChance ? item.boostChance : item.chance * (boosted && item.boosted ? 2 : 1)
      }));
      const fixed = raw.filter(item => item.boosted || item.boostChance);
      const flexible = raw.filter(item => !item.boosted && !item.boostChance);
      const fixedTotal = fixed.reduce((sum, item) => sum + item.targetWeight, 0);
      const flexibleTotal = flexible.reduce((sum, item) => sum + item.targetWeight, 0);
      const flexibleScale = flexibleTotal > 0 ? Math.max(0, 100 - fixedTotal) / flexibleTotal : 1;
      return raw.map(item => ({
        ...item,
        weight: item.boosted || item.boostChance ? item.targetWeight : item.targetWeight * flexibleScale
      }));
    }

    function rollOdds(pack, boosted) {
      const weighted = weightedOdds(pack, boosted);
      const total = weighted.reduce((sum, item) => sum + item.weight, 0);
      return weighted.map(item => ({ ...item, rollChance: item.weight / total * 100 }));
    }

    function pickBlook(pack, user) {
      const boosted = activeLuckBoost(user).active;
      const pool = weightedOdds(pack, boosted);
      const total = pool.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * total;
      return pool.find(item => (roll -= item.weight) <= 0) || pool[0];
    }

    function announceRarePull(user, pack, results) {
      const hype = results.filter(item => ["supreme", "mythic"].includes(item.rarity));
      if (!hype.length) return;
      const best = hype.reduce((a, b) => rarityValues[b.rarity] > rarityValues[a.rarity] ? b : a, hype[0]);
      const extra = hype.length > 1 ? ` plus ${hype.length - 1} more supreme/mythic pull${hype.length - 1 === 1 ? "" : "s"}` : "";
      const clan = clanFor(user.id);
      if (clan) {
        state.clanChats ||= [];
        state.clanChats.push({
          id: id(),
          clanId: clan.id,
          system: true,
          text: `${user.name} pulled ${best.name} from ${pack.name}${extra}.`,
          time: Date.now()
        });
      }
      state.chats.push({
        id: id(),
        system: true,
        text: `${user.name} just pulled a ${best.name} from ${pack.name}${extra}!`,
        time: Date.now()
      });
    }

    function addBlook(user, item, source = "market") {
      user.inventory.push({ ...canonicalBlook(item), uid: id(), source, openedAt: Date.now() });
    }

    function packForItem(item) {
      return packs.find(pack => pack.blooks.some(blook => blook.name === item.name)) || null;
    }

    function isLimitedItem(item) {
      const pack = packForItem(item);
      return !!(item.limited || pack?.limited);
    }

    function blookBadges(item) {
      return isLimitedItem(item) ? `<span class="limited-badge">Limited</span>` : "";
    }

    function marketHint(item, price = listingDefaultPrice(item)) {
      const guide = marketGuide[item.name];
      if (!guide) return "";
      let label = "very high";
      if (price < guide.veryLow) label = "very low";
      else if (price < guide.low) label = "low";
      else if (price < guide.fair) label = "fair-ish";
      else if (price < guide.high) label = "high";
      return `<div class="market-hint">Plus market hint: ${label}</div>`;
    }

    function packNameForItem(item) {
      return packForItem(item)?.name || item.source || "Other";
    }

    function listingDefaultPrice(item) {
      const cheapest = state.listings
        .filter(listing => !listing.sold && listing.item.name === item.name && listing.item.rarity === item.rarity)
        .reduce((min, listing) => Math.min(min, listing.price), Infinity);
      if (Number.isFinite(cheapest)) return Math.max(1, cheapest - 1);
      if (marketGuide[item.name]) return marketGuide[item.name].fair;
      return rarityValues[item.rarity] || 1;
    }

    function groupedInventory(user) {
      return Object.values(user.inventory.reduce((map, item) => {
        const key = `${packNameForItem(item)}:${item.name}:${item.rarity}`;
        map[key] ||= { ...item, packName: packNameForItem(item), count: 0, ids: [] };
        map[key].count++;
        map[key].ids.push(item.uid);
        return map;
      }, {})).sort((a, b) => a.packName.localeCompare(b.packName) || rarityValues[b.rarity] - rarityValues[a.rarity] || a.name.localeCompare(b.name));
    }

    function userById(userId) {
      return state.users.find(u => u.id === userId);
    }

    function render() {
      const user = currentUser();
      document.getElementById("authBox").classList.toggle("hidden", !!user);
      document.getElementById("userBox").classList.toggle("hidden", !user);
      renderTabs(user);
      if (!user) {
        document.getElementById("viewTitle").textContent = "Packlet";
        document.getElementById("viewSubtitle").textContent = "Login or register to enter the dark themed pack market.";
        document.getElementById("quickStats").innerHTML = "";
        document.getElementById("view").innerHTML = `<div class="card pad stack"><h3>Welcome</h3><p class="muted">Use the seeded admin account or make a new player account. This prototype saves everything in this browser.</p></div>`;
        return;
      }
      if (user.banned) {
        document.getElementById("view").innerHTML = `<div class="card pad"><h3>Account banned</h3><p class="muted">An admin banned this account in the local prototype.</p></div>`;
        return;
      }
      if (currentView === "admin" && !user.admin) currentView = "market";
      const view = views.find(v => v[0] === currentView);
      document.getElementById("viewTitle").textContent = view[1];
      document.getElementById("viewSubtitle").textContent = view[2];
      renderUserBox(user);
      renderQuickStats(user);
      document.getElementById("view").innerHTML = renderView(currentView, user);
      bindView(currentView, user);
    }

    function renderTabs(user) {
      document.getElementById("tabs").innerHTML = views
        .filter(v => v[0] !== "admin" || user?.admin)
        .map(v => `<button class="tab ${currentView === v[0] ? "active" : ""}" data-view="${v[0]}" type="button">${iconFor(v[0])} ${v[1]}</button>`)
        .join("");
      document.querySelectorAll("[data-view]").forEach(btn => {
        btn.onclick = () => {
          currentView = btn.dataset.view;
          render();
        };
      });
    }

    function iconFor(view) {
      return ({ market:"🛍️", inventory:"🎒", bazaar:"🏷️", chat:"💬", trade:"🤝", clans:"🏰", wheel:"🎡", stats:"📊", plus:"➕", admin:"🛠️" })[view] || "•";
    }

    function renderUserBox(user) {
      const clan = clanFor(user.id);
      const boost = activeLuckBoost(user);
      const globalBooster = Math.max(0, (state.globalBoosterUntil || 0) - Date.now());
      const booster = Math.max(0, user.boosterUntil - Date.now());
      const clanBooster = Math.max(0, clan?.boosterUntil - Date.now());
      const boostText = globalBooster > 0
        ? `Global booster: ${Math.ceil(globalBooster / 60000)} min left`
        : booster > 0
        ? `${escapeHtml(user.name)} is boosting: ${Math.ceil(booster / 60000)} min left`
        : clanBooster > 0
          ? `[${escapeHtml(clan.name)}] clan booster: ${Math.ceil(clanBooster / 60000)} min left`
          : "No active booster";
      document.getElementById("userBox").innerHTML = `
        <div class="row between">
          <div class="row">${profilePic(user)}<strong style="color:${escapeHtml(user.nameColor || "#eef4ff")}">${escapeHtml(user.name)}</strong></div>
          <button id="logoutBtn" class="ghost" type="button">Logout</button>
        </div>
        <div class="pillrow">
          <span class="pill">${money(user.tokens)} tokens</span>
          <span class="pill">Lvl ${levelFor(user)}</span>
          ${isPlus(user) ? `<span class="pill">Plus</span>` : ""}
          ${user.admin ? `<span class="pill">Admin</span>` : ""}
          ${clan ? `<span class="pill">[${escapeHtml(clan.name)}]</span>` : ""}
        </div>
        <div class="small muted">${boost.active ? boostText : "No active booster"}</div>
        ${SERVER_MODE ? `<div class="server-note">Shared server mode is on. Friends who open this server link use the same Packlet world.</div>` : `<div class="server-note">Open with the Packlet server to let friends join the same world.</div>`}
      `;
      document.getElementById("logoutBtn").onclick = () => {
        localStorage.removeItem("packlet_session_email");
        sessionEmail = "";
        render();
      };
    }

    function renderQuickStats(user) {
      const tradeRequests = state.trades.filter(t => t.status === "requested" && t.toId === user.id).length;
      document.getElementById("quickStats").innerHTML = `
        <span class="pill">${money(user.tokens)} tokens</span>
        <span class="pill">${user.inventory.length} blooks</span>
        <span class="pill">${user.messages || 0} msgs</span>
        <span class="pill">${user.packOpens || 0} opens</span>
        ${tradeRequests ? `<span class="pill">${tradeRequests} trade req</span>` : ""}
      `;
    }

    function renderView(view, user) {
      if (view === "market") return renderMarket(user);
      if (view === "inventory") return renderInventory(user);
      if (view === "bazaar") return renderBazaar(user);
      if (view === "chat") return renderChat(user);
      if (view === "trade") return renderTrade(user);
      if (view === "clans") return renderClans(user);
      if (view === "wheel") return renderWheel(user);
      if (view === "stats") return renderStats(user);
      if (view === "plus") return renderPlus(user);
      if (view === "admin") return renderAdmin(user);
      return "";
    }

    function renderMarket(user) {
      const openPacks = packs.filter(p => !p.adminOnly || user.admin);
      const boost = activeLuckBoost(user);
      const boosted = boost.active;
      const boostLabel = boost.globalBoost
        ? `Global booster is boosting rare pulls for everyone.`
        : boost.clanBoost
          ? `[${escapeHtml(boost.clan.name)}] clan booster is boosting this pack's rare pulls.`
          : `${escapeHtml(user.name)} is boosting this pack's rare pulls.`;
      return `
        <div class="widegrid">
          <div class="grid">
            ${openPacks.map(pack => {
              const packCost = pack.cost || 25;
              return `<article class="card pack" style="--c1:${pack.c1};--c2:${pack.c2}">
              <div class="pack-art open-pack-art" data-pack="${pack.id}" role="button" tabindex="0" aria-label="Open 1 ${pack.name}"><div class="pack-icon">${packVisual(pack)}</div></div>
              <div class="pad stack">
                <div>
                  <h3>${pack.name}</h3>
                  <div class="small muted">${money(packCost)} tokens each. No common blooks.</div>
                </div>
                ${boosted ? `<div class="boost-banner">${boostLabel}</div>` : ""}
                <div class="row between wrap">
                  <div class="pillrow">${[...new Set(pack.blooks.map(b => b.rarity))].map(r => `<span class="pill rarity ${r}">${r}</span>`).join("")}</div>
                  <span class="chance-help" tabindex="0">?
                    <span class="chance-popup">
                      <span class="small muted">${boosted ? "Boosted roll odds" : "Base roll odds"}</span>
                      <span class="odds-grid" style="margin-top:8px">
                        ${rollOdds(pack, boosted).map(item => `<span class="odds-item ${itemClass(item)}">
                          <span class="odds-name">${escapeHtml(item.name)}</span>
                          <span class="odds-rarity rarity ${item.rarity}">${item.rarity}</span>
                          <strong>${formatChance(item.rollChance)}</strong>
                        </span>`).join("")}
                      </span>
                    </span>
                  </span>
                </div>
                <div class="small muted">Hover the ? to see chances.</div>
                <div class="row wrap">
                  <button class="primary open-pack" data-pack="${pack.id}" data-count="1" type="button">Open 1</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="10" type="button">Open 10</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="50" type="button">Open 50</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="100" type="button">Open 100</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="500" type="button">Open 500</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="1000" type="button">Open 1000</button>
                  <button class="open-pack" data-pack="${pack.id}" data-count="max" type="button">Max</button>
                </div>
              </div>
            </article>`;
            }).join("")}
          </div>
          <aside class="card pad stack">
            <h3>Boosters</h3>
            <p class="muted">Shop boosters are global. They boost epics and above by 2x for everyone while active.</p>
            <button class="buy-booster primary" data-hours="1" data-cost="10000" type="button">Buy global 1 hr booster - 10,000</button>
            <button class="buy-booster" data-hours="3" data-cost="15000" type="button">Buy global 3 hr booster - 15,000</button>
            <h3>Direct Sell Values</h3>
            <div class="stack">${Object.entries(rarityValues).map(([r,v]) => `<div class="row between"><span class="rarity ${r}">${r}</span><strong>${money(v)}</strong></div>`).join("")}</div>
          </aside>
        </div>
      `;
    }

    function renderInventory(user) {
      const grouped = groupedInventory(user);
      const byPack = grouped.reduce((map, item) => {
        map[item.packName] ||= [];
        map[item.packName].push(item);
        return map;
      }, {});
      const myListings = state.listings.filter(listing => !listing.sold && listing.sellerId === user.id);
      const mySoldNotices = state.listings.filter(listing => listing.sold && listing.sellerId === user.id && listing.privateNotice).slice(-6).reverse();
      const badDupeOptions = grouped.filter(item => item.count > 1 && ["uncommon", "rare", "epic"].includes(item.rarity));
      const unique = new Set(user.inventory.map(item => item.name)).size;
      const value = user.inventory.reduce((sum, item) => sum + (rarityValues[item.rarity] || 0), 0);
      const score = unique * 10 + user.inventory.length + Math.floor(value / 100);
      return `
        <div class="collection-shell">
          <section class="collection-panel stack">
            <div class="row between wrap">
              <h3>Your Blooks</h3>
              <div class="row wrap">
                <button id="toggleMyListings" type="button">My listings (${myListings.length})</button>
                <button id="sellDupes" class="primary" type="button">Sell all dupes</button>
                <button id="sellAll" class="danger" type="button">Sell all</button>
              </div>
            </div>
            <div id="myListingsPanel" class="card pad stack ${myListingsOpen ? "" : "hidden"}">
              <h3>Your Bazaar Listings</h3>
              <div class="inventory-list">
                ${myListings.length ? myListings.map(listing => blookCard(listing.item, `
                  <div class="small muted">Price: ${money(listing.price)}</div>
                  <button class="cancel-listing" data-id="${listing.id}" type="button">Cancel listing</button>
                `)).join("") : `<p class="muted">You do not have active listings.</p>`}
              </div>
            </div>
            ${mySoldNotices.length ? `<div class="card pad stack">
              <h3>Private Bazaar Notices</h3>
              ${mySoldNotices.map(listing => `<div class="message system"><strong>Sold</strong><div class="muted">${escapeHtml(listing.privateNotice)}</div></div>`).join("")}
              <button id="clearBazaarNotices" type="button">Clear notices</button>
            </div>` : ""}
            <div class="card pad stack">
              <h3>Custom Bad Dupe Sell</h3>
              <p class="muted small">Choose which epic-and-below duplicates to sell. Packlet keeps one copy of each selected blook.</p>
              <div class="pillrow">
                ${badDupeOptions.length ? badDupeOptions.map(item => `<label class="pill"><input class="bad-dupe-choice" type="checkbox" value="${escapeHtml(item.name)}|${escapeHtml(item.rarity)}" checked style="width:auto"> ${escapeHtml(item.name)} x${item.count - 1}</label>`).join("") : `<span class="muted small">No bad duplicates available.</span>`}
              </div>
              <button id="sellBadDupes" class="primary" type="button" ${badDupeOptions.length ? "" : "disabled"}>Sell selected bad dupes</button>
            </div>
            ${Object.entries(byPack).length ? Object.entries(byPack).map(([packName, items]) => `
              <section class="stack collection-pack">
                <div class="row between wrap collection-title"><h3>${escapeHtml(packName)}</h3><span class="pill">${items.reduce((sum, item) => sum + item.count, 0)} blooks</span></div>
                <div class="collection-grid">
                  ${items.map(item => collectionBlookCard(item)).join("")}
                </div>
              </section>
            `).join("") : `<p class="muted">No blooks yet. Open some packs in the market.</p>`}
          </section>
          <aside class="collection-score-card stack">
            <div class="score-star"><div>${money(score)}<br><span class="small">Blook Score</span></div></div>
            <div class="score-stat-grid">
              <div class="score-stat"><strong>${money(user.inventory.length)}</strong><span>Blooks</span></div>
              <div class="score-stat"><strong>${money(unique)}</strong><span>Unlocked</span></div>
              <div class="score-stat"><strong>${money(value)}</strong><span>Value</span></div>
              <div class="score-stat"><strong>${money(user.packOpens || 0)}</strong><span>Opens</span></div>
            </div>
            <p class="muted small">Click a blook tile to sell, list, or use it as your profile picture.</p>
          </aside>
        </div>
      `;
    }

    function renderBazaar(user) {
      const activeListings = state.listings.filter(l => !l.sold && l.sellerId !== user.id);
      return `
        <div class="card pad stack">
          <div class="row between wrap">
            <h3>Live Bazaar</h3>
            <span class="pill">Manage your own listings from Blooks</span>
          </div>
          <div class="inventory-list">
            ${activeListings.length ? activeListings.sort((a, b) => a.price - b.price).map(l => {
              const seller = userById(l.sellerId);
              return blookCard(l.item, `
                <div class="small muted">Seller: ${escapeHtml(seller?.name || "Unknown")} · Price: ${money(l.price)}</div>
                ${isPlus(user) ? marketHint(canonicalBlook(l.item), l.price) : ""}
                <div class="row wrap" style="margin-top:8px">
                  ${l.sellerId === user.id ? `<button class="cancel-listing" data-id="${l.id}" type="button">Cancel</button>` : `<button class="buy-listing primary" data-id="${l.id}" type="button">Buy</button>`}
                </div>
              `);
            }).join("") : `<p class="muted">No listings yet.</p>`}
          </div>
        </div>
      `;
    }

    function chatName(user) {
      const clan = clanFor(user.id);
      const clanTag = clan ? `<span style="${clan.paint === "rainbow" ? "background:linear-gradient(90deg,#ff6f61,#ffd36b,#21d19f,#5aa7ff,#c88cff);-webkit-background-clip:text;color:transparent" : `color:${escapeHtml(clan.paint || "#9ca9bd")}`}">[${escapeHtml(clan.name)}]</span>` : "";
      return `${profilePic(user)}<span class="name" style="color:${escapeHtml(user.nameColor || "#eef4ff")}">${escapeHtml(user.name)}</span> ${clanTag} ${user.admin ? `<span class="admin">ADMIN</span>` : ""} ${isPlus(user) ? `<span class="pill">PLUS</span>` : ""}`;
    }

    function chatMessageHtml(m, viewer) {
      const author = userById(m.userId);
      if (m.system) return `<div class="message system"><strong>Packlet</strong> <span class="small muted">${new Date(m.time).toLocaleTimeString()}</span><div class="muted">${escapeHtml(m.text)}</div></div>`;
      return `<div class="message ${m.userId === viewer.id ? "own" : ""}"><div>${author ? chatName(author) : "Unknown"} <span class="small muted">${new Date(m.time).toLocaleTimeString()}</span></div><div style="color:${escapeHtml(author?.textColor || "#eef4ff")}">${escapeHtml(m.text)}</div></div>`;
    }

    function refreshChatLog(user) {
      const chatLog = document.getElementById("chatLog");
      if (!chatLog) return;
      chatLog.innerHTML = state.chats.slice(-120).map(m => chatMessageHtml(m, user)).join("");
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function renderChat(user) {
      return `
        <div class="widegrid">
          <section class="card pad stack">
            <div id="chatLog" class="chatlog">
              ${state.chats.slice(-120).map(m => chatMessageHtml(m, user)).join("")}
            </div>
            <div class="row">
              <input id="chatInput" maxlength="240" placeholder="${user.muted ? "You are muted" : "Message Packlet..."}" ${user.muted ? "disabled" : ""}>
              <button id="sendChat" class="primary" type="button" ${user.muted ? "disabled" : ""}>Send</button>
            </div>
          </section>
          <aside class="card pad stack">
            <h3>Chat Rewards</h3>
            <p class="muted">Every sent message gives a random 1-5 tokens, adds chat XP, and pings mentioned players with @name.</p>
            <div class="stat"><span>Messages sent</span><strong>${money(user.messages || 0)}</strong></div>
          </aside>
        </div>
      `;
    }

    function renderTrade(user) {
      const trades = state.trades.filter(t => [t.fromId, t.toId].includes(user.id) && ["requested", "open", "declined"].includes(t.status));
      const activeTrade = trades.find(t => t.id === activeTradeId && t.status === "open") || trades.find(t => t.status === "open");
      if (activeTrade) {
        activeTradeId = activeTrade.id;
        const isFrom = activeTrade.fromId === user.id;
        const other = userById(isFrom ? activeTrade.toId : activeTrade.fromId);
        const mine = isFrom ? activeTrade.fromOffer : activeTrade.toOffer;
        const theirs = isFrom ? activeTrade.toOffer : activeTrade.fromOffer;
        const myAccepted = !!activeTrade.accepted?.[user.id];
        const otherAccepted = !!activeTrade.accepted?.[other?.id];
        const bothAccepted = myAccepted && otherAccepted;
        const myConfirmed = !!activeTrade.confirmed?.[user.id];
        const otherConfirmed = !!activeTrade.confirmed?.[other?.id];
        return `
          <div class="widegrid">
            <section class="card pad stack">
              <div class="row between wrap">
                <h3>Private Trade: ${escapeHtml(other?.name || "Unknown")}</h3>
                <button id="leaveTradeView" type="button">Back to requests</button>
              </div>
              <div class="split">
                <div class="card pad stack">
                  <h3>Your Offer</h3>
                  <label>Blooks, up to 4<select id="myTradeBlooks" multiple size="8">${user.inventory.map(i => `<option value="${i.uid}" ${mine.items.some(item => item.uid === i.uid) ? "selected" : ""}>${escapeHtml(i.name)} (${i.rarity})</option>`).join("")}</select></label>
                  <label>Tokens<input id="myTradeTokens" type="number" min="0" value="${mine.tokens || 0}"></label>
                  <button id="saveTradeOffer" type="button">Save offer</button>
                  <button id="acceptTradeOffer" class="primary" type="button">${myAccepted ? "Offer accepted" : "Accept offer"}</button>
                  <button id="confirmTrade" class="primary" type="button" ${bothAccepted && !myConfirmed ? "" : "disabled"}>${myConfirmed ? "Confirmed" : "Confirm trade"}</button>
                </div>
                <div class="card pad stack">
                  ${tradeSide(theirs, "Their offer", `${escapeHtml(other?.name || "Their")} Offer`)}
                  <div class="pillrow">
                    <span class="pill">You: ${myAccepted ? "accepted" : "editing"}</span>
                    <span class="pill">${escapeHtml(other?.name || "Other")}: ${otherAccepted ? "accepted" : "editing"}</span>
                    <span class="pill">Confirm: ${myConfirmed ? "you" : "-"} ${otherConfirmed ? `+ ${escapeHtml(other?.name || "other")}` : ""}</span>
                  </div>
                </div>
              </div>
              <div class="tradelog">${activeTrade.chat.map(m => `<div class="message ${m.userId === user.id ? "own" : ""}"><strong>${escapeHtml(userById(m.userId)?.name || "Unknown")}:</strong> ${escapeHtml(m.text)}</div>`).join("")}</div>
              <div class="row">
                <input id="tradeChatInput" placeholder="Private trade chat">
                <button id="sendTradeChat" type="button">Send</button>
                <button id="cancelTrade" class="danger" type="button">Cancel trade</button>
              </div>
            </section>
            <aside class="card pad stack">
              <h3>How it works</h3>
              <p class="muted">Change your offer as much as you want. Any change resets accepts. Both players accept, then both confirm, then the trade completes and sends you back to Stats.</p>
            </aside>
          </div>
        `;
      }
      const incoming = trades.filter(t => t.status === "requested" && t.toId === user.id);
      const outgoing = trades.filter(t => t.status === "requested" && t.fromId === user.id);
      const declined = trades.filter(t => t.status === "declined");
      return `
        <div class="widegrid">
          <section class="card pad stack">
            <h3>Trade Requests</h3>
            ${incoming.length ? incoming.map(t => {
              const other = userById(t.fromId);
              return `<div class="card pad stack">
                <div class="row between wrap"><strong>${escapeHtml(other?.name || "Unknown")} wants to trade</strong><span class="pill">request</span></div>
                <div class="row wrap">
                  <button class="accept-request primary" data-id="${t.id}" type="button">Accept</button>
                  <button class="decline-request danger" data-id="${t.id}" type="button">Decline</button>
                </div>
              </div>`;
            }).join("") : `<p class="muted">No incoming requests.</p>`}

      if (view === "wheel") bindWheel(user);
      if (view === "plus") bindPlus(user);

    function bindMarket(user) {
      document.querySelectorAll(".open-pack").forEach(btn => btn.onclick = () => openPacks(btn.dataset.pack, btn.dataset.count));
      document.querySelectorAll(".open-pack-art").forEach(art => {
        art.onclick = () => openPacks(art.dataset.pack, "1");
        art.onkeydown = event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openPacks(art.dataset.pack, "1");
          }
        };
      });
      document.querySelectorAll(".buy-booster").forEach(btn => btn.onclick = () => {
        const hours = Number(btn.dataset.hours);
        const cost = Number(btn.dataset.cost);
        if (!spendTokens(user, cost)) return toast("Not enough tokens for that booster.");
        state.globalBoosterUntil = Math.max(Date.now(), state.globalBoosterUntil || 0) + hours * 3600000;
        state.chats.push({
          id: id(),
          system: true,
          text: `${user.name} activated a ${hours} hr global luck booster. Rare pack pulls are boosted for everyone.`,
          time: Date.now()
        });
        saveState();
        toast(`${hours} hr global booster activated.`);
        render();
      });
    }

    function openPacks(packId, requested) {
      const user = currentUser();
      const pack = packs.find(p => p.id === packId);
      const packCost = pack.cost || 25;
      let count = requested === "max" ? Math.floor(user.tokens / packCost) : Number(requested);
      const limit = isPlus(user) ? Infinity : 1000;
      count = Math.min(count, Math.floor(user.tokens / packCost), limit);
      if (!count) return toast("Not enough tokens to open that many packs.");
      spendTokens(user, count * packCost);
      const results = [];
      for (let i = 0; i < count; i++) {
        const item = pickBlook(pack, user);
        addBlook(user, item, pack.name);
        results.push(item);
      }
      user.packOpens = (user.packOpens || 0) + count;
      const packXpMultiplier = Math.max(1, packCost / 25);
      addXp(user, count * 2 * packXpMultiplier);
      const clan = clanFor(user.id);
      addClanXp(clan, user.id, count * packXpMultiplier);
      announceRarePull(user, pack, results);
      saveState();
      showOpenModal(pack, results, count);
      render();
    }

    function showOpenModal(pack, results, count, options = {}) {
      const best = results.reduce((a, b) => rarityValues[b.rarity] > rarityValues[a.rarity] ? b : a, results[0]);
      const modal = document.getElementById("modal");
      const simulated = !!options.simulated;
      const epicPlus = rarityValues[best.rarity] >= rarityValues.epic;
      const singleOpen = count === 1 && !simulated;
      const protectedReveal = rarityValues[best.rarity] >= rarityValues.legendary;
      const fastOpenReady = singleOpen && !protectedReveal;
      const resultDelay = 720;
      const readyDelay = protectedReveal
        ? ({ legendary: 1850, chroma: 1900, supreme: 2050, mythic: 2650 }[best.rarity] || 1850)
        : resultDelay;
      const isMythic = best.rarity === "mythic";
      const shine = epicPlus ? rarityColors[best.rarity]?.[0] || "#ffffff" : "#ffffff";
      const rarityClass = epicPlus ? `rarity-${best.rarity}` : "";
      modal.innerHTML = `<div class="modal-inner">
        <button id="closeModal" class="modal-close ghost" type="button" aria-label="Close">×</button>
        <h3>${simulated ? "Simulating" : "Opening"} ${count} ${pack.name}${count > 1 ? "s" : ""}</h3>
        <div id="openingStage" class="opening-stage ${epicPlus ? "epic-plus" : ""} ${rarityClass}">
          ${isMythic ? `<div id="mythicBanner" class="mythic-banner">MYTHIC</div>` : ""}
          <div class="opening-ring"></div>
          <div id="openingPack" class="opening-pack charge" style="--c1:${pack.c1};--c2:${pack.c2}">${packVisual(pack)}</div>
          <div id="openingFlash" class="opening-flash"></div>
          <div id="confettiLayer"></div>
          <div id="openResult" class="opening-result-card ${fastOpenReady ? "fast-open" : ""} ${rarityClass} ${["chroma", "supreme", "mythic"].includes(best.rarity) ? "shiny" : ""}" style="--shine:${shine}" ${singleOpen ? `role="button" tabindex="0" aria-label="Open another ${pack.name}"` : ""}>
            ${blookCard(best, `<div class="small muted">${simulated ? "Admin simulation only - not added to inventory" : singleOpen ? (protectedReveal ? "Rare pull" : "Click to keep opening") : `Best pull from ${count} packs`}</div>`)}
          </div>
        </div>
        <div id="openSummary" class="hidden stack">
          <div class="pillrow">${Object.entries(results.reduce((m, i) => (m[i.rarity] = (m[i.rarity] || 0) + 1, m), {})).map(([r,c]) => `<span class="pill rarity ${r}">${r}: ${c}</span>`).join("")}</div>
          ${count === 1 && !simulated ? `<div class="row" style="justify-content:center"><button id="openAnother" class="primary" type="button">Open another</button><button id="stopOpening" type="button">Stop</button></div>` : `<button id="stopOpening" class="primary" type="button">${simulated ? "Close simulation" : "Done"}</button>`}
        </div>
      </div>`;
      modal.classList.remove("hidden");
      const closeModal = () => modal.classList.add("hidden");
      const openAgain = () => openPacks(pack.id, "1");
      setTimeout(() => {
        document.getElementById("openingPack")?.classList.remove("charge");
        document.getElementById("openingPack")?.classList.add("burst");
        document.getElementById("openingFlash")?.classList.add(isMythic ? "mythic-on" : "on");
        document.getElementById("openingStage")?.classList.add("bloom");
        if (isMythic) document.getElementById("mythicBanner")?.classList.add("show");
        const layer = document.getElementById("confettiLayer");
        if (layer) layer.innerHTML = confettiPieces(best.rarity);
      }, 430);
      setTimeout(() => {
        document.getElementById("openResult")?.classList.add("show");
      }, resultDelay);
      setTimeout(() => {
        if (singleOpen) document.getElementById("openResult")?.classList.add("fast-open");
        document.getElementById("openSummary")?.classList.remove("hidden");
        if (!simulated) document.getElementById("openAnother")?.addEventListener("click", openAgain);
        document.getElementById("stopOpening")?.addEventListener("click", closeModal);
        if (singleOpen) {
          const result = document.getElementById("openResult");
          result?.addEventListener("click", openAgain);
          result?.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              openAgain();
            }
          });
        }
      }, readyDelay);
      setTimeout(() => document.getElementById("closeModal")?.addEventListener("click", closeModal), protectedReveal ? readyDelay : 50);
    }

    function confettiPieces(rarity) {
      const palette = {
        uncommon: ["#71e094", "#b8ffd0", "#ffffff"],
        rare: ["#6fb9ff", "#d7ebff", "#ffffff"],
        epic: ["#c88cff", "#f0ddff", "#ffffff"],
        legendary: ["#ffd36b", "#fff1b5", "#ffffff"],
        chroma: ["#70fff4", "#ff89cf", "#ffd36b", "#c88cff", "#ffffff"],
        supreme: ["#ff89cf", "#70fff4", "#fff", "#ffd36b"],
        mythic: ["#ff6f61", "#ffd36b", "#ff89cf", "#fff1b5", "#ffffff", "#ff2f55"]
      }[rarity] || ["#ffffff", "#21d19f", "#5aa7ff"];
      const shiny = ["chroma", "supreme", "mythic"].includes(rarity);
      const total = rarity === "mythic" ? 170 : shiny ? 118 : 74;
      return Array.from({ length: total }, (_, index) => {
        const angle = (Math.PI * 2 / total) * index;
        const distance = (rarity === "mythic" ? 130 : 110) + (index % 10) * 18;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance - 40;
        const color = palette[index % palette.length];

        return `<span class="confetti-piece" style="--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px;--rot:${(index * 37) % 360}deg;--delay:${(index % 16) * .028}s;--confetti:${color};--cw:${wide ? 12 : 7}px;--ch:${wide ? 7 : 15}px"></span>`;
      }).join("");
    }

    function botTradeText(bot, trade) {
      const lines = [
        "i put up a simple test offer",
        "looks fine for testing",
        "countered with something small",
        "i can confirm whenever",
        "not too fancy, just bot trading"
      ];
      const wants = trade.fromOffer.items.length || trade.fromOffer.tokens;
      if (!wants) return "add something if u want, but i can still test the flow";
      return lines[Math.floor(Math.random() * lines.length)];
    }

    function makeBotOffer(bot, trade) {
      const offeredValue = (trade.fromOffer?.tokens || 0) + (trade.fromOffer?.items || []).reduce((sum, item) => sum + (rarityValues[item.rarity] || 0), 0);
      const sorted = [...(bot.inventory || [])].map(canonicalBlook).sort((a, b) => (rarityValues[a.rarity] || 0) - (rarityValues[b.rarity] || 0));
      const items = [];
      if (sorted.length && (offeredValue >= 50 || Math.random() < 0.7)) items.push(sorted[Math.min(sorted.length - 1, Math.floor(Math.random() * Math.min(4, sorted.length)))]);
      const tokenOffer = Math.min(bot.tokens || 0, Math.max(0, Math.round(offeredValue * 0.45) + (items.length ? 0 : 250)));
      return { tokens: tokenOffer, items: items.slice(0, 1) };
    }

    function botRespondToTrade(trade) {
      const bot = userById(trade.toId)?.bot ? userById(trade.toId) : userById(trade.fromId)?.bot ? userById(trade.fromId) : null;
      if (!bot || trade.status !== "open") return;
      const botIsFrom = trade.fromId === bot.id;
      if (botIsFrom) trade.fromOffer = makeBotOffer(bot, trade);
      else trade.toOffer = makeBotOffer(bot, trade);
      trade.accepted ||= {};
      trade.confirmed ||= {};
      trade.accepted[bot.id] = true;
      trade.confirmed = {};
      trade.chat ||= [];
      trade.chat.push({ userId: bot.id, text: botTradeText(bot, trade), time: Date.now() });
    }

    function botConfirmIfReady(trade) {
      const bot = userById(trade.toId)?.bot ? userById(trade.toId) : userById(trade.fromId)?.bot ? userById(trade.fromId) : null;
      if (!bot || trade.status !== "open") return;
      const humanId = trade.fromId === bot.id ? trade.toId : trade.fromId;
      if (trade.accepted?.[humanId]) trade.accepted[bot.id] = true;
      if (trade.confirmed?.[humanId]) trade.confirmed[bot.id] = true;
    }

        const trade = {
          id: id(),

          activeTradeId = trade.id;

      document.getElementById("leaveTradeView")?.addEventListener("click", () => {

      });
      document.getElementById("saveTradeOffer")?.addEventListener("click", () => {
        const trade = state.trades.find(t => t.id === activeTradeId && t.status === "open");

        const isFrom = trade.fromId === user.id;
        const tokens = Math.max(0, Number(document.getElementById("myTradeTokens").value || 0));
        if (tokens > user.tokens) return toast("Not enough tokens.");

        else trade.toOffer = offer;

        trade.confirmed = {};
        botRespondToTrade(trade);
        saveState();
        toast("Offer saved. Both players need to accept again.");
        render();
      });
      document.getElementById("acceptTradeOffer")?.addEventListener("click", () => {
        const trade = state.trades.find(t => t.id === activeTradeId && t.status === "open");
        if (!trade) return;
        trade.accepted ||= {};
        trade.accepted[user.id] = true;
        trade.confirmed = {};
        botConfirmIfReady(trade);
        saveState();
        render();
      });
      document.getElementById("confirmTrade")?.addEventListener("click", () => {
        const trade = state.trades.find(t => t.id === activeTradeId && t.status === "open");
        if (!trade) return;
        trade.confirmed ||= {};
        trade.confirmed[user.id] = true;
        botConfirmIfReady(trade);
        if (trade.confirmed[trade.fromId] && trade.confirmed[trade.toId]) {
          if (!completeTrade(trade)) return;
          activeTradeId = "";
          currentView = "stats";
        }
        saveState();
        render();
      });
      document.getElementById("sendTradeChat")?.addEventListener("click", () => {
        const trade = state.trades.find(t => t.id === activeTradeId && t.status === "open");

        if (bot && Math.random() < 0.65) trade.chat.push({ userId: bot.id, text: botTradeText(bot, trade), time: Date.now() });

      document.getElementById("cancelTrade")?.addEventListener("click", () => {

      });
    }

    function completeTrade(trade) {
      const from = userById(trade.fromId);
      const to = userById(trade.toId);
      if (!from || !to) return false;
      if (from.tokens < trade.fromOffer.tokens || to.tokens < trade.toOffer.tokens) {
        toast("One side no longer has enough tokens.");
        return false;
      }
      const fromIds = new Set(trade.fromOffer.items.map(i => i.uid));
      const toIds = new Set(trade.toOffer.items.map(i => i.uid));
      if (![...fromIds].every(uid => from.inventory.some(i => i.uid === uid))) {
        toast("Sender no longer owns every offered blook.");
        return false;
      }
      if (![...toIds].every(uid => to.inventory.some(i => i.uid === uid))) {
        toast("Receiver no longer owns every offered blook.");
        return false;
      }
      from.tokens -= trade.fromOffer.tokens;
      addTokens(to, trade.fromOffer.tokens);
      to.tokens -= trade.toOffer.tokens;
      addTokens(from, trade.toOffer.tokens);
      from.inventory = from.inventory.filter(i => !fromIds.has(i.uid));
      to.inventory = to.inventory.filter(i => !toIds.has(i.uid));
      to.inventory.push(...trade.fromOffer.items);
      from.inventory.push(...trade.toOffer.items);
      trade.status = "completed";
      state.tradeHistory.push({ id: id(), time: Date.now(), summary: `${from.name} traded ${trade.fromOffer.items.length} blooks and ${trade.fromOffer.tokens} tokens with ${to.name} for ${trade.toOffer.items.length} blooks and ${trade.toOffer.tokens} tokens.` });
      toast("Trade completed.");
      return true;
    }

        if (!clan || select.dataset.user === clan.ownerId) return;
        clan.roles ||= {};
        clan.roles[select.dataset.user] = select.value;
        saveState();
        toast("Clan role updated.");
        render();
      });
      document.querySelectorAll(".apply-clan").forEach(btn => btn.onclick = () => {
        const clan = state.clans.find(c => c.id === btn.dataset.id);
        if (!clan || clan.applications.includes(user.id)) return;
        if (clanFor(user.id)) return toast("You are already in a clan.");
        if (clan.members.length >= 50) return toast("That clan is full.");
        if (clan.bot) {
          if (!acceptClanMember(clan, user.id)) return toast("Could not join that clan.");
          saveState();
          toast("Bot clan accepted you.");
          render();
          return;
        }
        clan.applications.push(user.id);
        saveState();
        toast("Clan application sent.");
        render();
      });
      document.querySelectorAll(".accept-clan").forEach(btn => btn.onclick = () => {
        const clan = state.clans.find(c => c.id === btn.dataset.clan && canManageClan(c, user.id));
        if (!clan) return;
        const applicant = btn.dataset.user;
        if (!acceptClanMember(clan, applicant)) return toast("Could not accept that player.");
        saveState();
        render();
      });
      document.querySelectorAll(".clan-paint").forEach(select => select.onchange = () => {
        const clan = state.clans.find(c => c.id === select.dataset.id && canManageClan(c, user.id));
        if (!clan) return;
        clan.paint = select.value;
        saveState();
        render();
      });
      document.querySelectorAll(".do-transfer").forEach(btn => btn.onclick = () => {
        const select = document.querySelector(`.transfer-clan[data-id="${btn.dataset.id}"]`);
        const clan = state.clans.find(c => c.id === btn.dataset.id && c.ownerId === user.id);
        if (!clan || !select.value) return;
        clan.roles ||= {};
        clan.roles[clan.ownerId] = "co-owner";
        clan.ownerId = select.value;
        clan.roles[clan.ownerId] = "owner";
        saveState();
        toast("Clan ownership transferred.");
        render();
      });
    }

    function bindWheel(user) {
      document.getElementById("spinWheel").onclick = () => {
        if (user.lastWheel === todayKey()) return;
        const index = Math.floor(Math.random() * wheelRewards.length);
        const reward = wheelRewards[index];
        const segment = 360 / wheelRewards.length;
        const targetAngle = -(index * segment + segment / 2);
        spinRotation += 360 * 5 + targetAngle - (spinRotation % 360);
        document.getElementById("wheel").style.transform = `rotate(${spinRotation}deg)`;
        document.getElementById("spinWheel").disabled = true;
        setTimeout(() => {
          addTokens(user, reward);
          user.lastWheel = todayKey();
          saveState();
          document.getElementById("wheelResult").textContent = `Landed on ${money(reward)} and awarded ${money(reward)} tokens.`;
          toast(`Daily wheel: +${money(reward)} tokens.`);
          renderUserBox(user);
          renderQuickStats(user);
        }, 3300);
      };
    }

    function bindPlus(user) {
      document.getElementById("buyPlus")?.addEventListener("click", () => {
        if (!spendTokens(user, 100000)) return toast("Not enough tokens for Plus.");
        user.plus = true;
        user.badge = "PLUS";
        addBlook(user, { name: "Plus Prism", icon: "💠", rarity: "chroma" }, "Plus");
        saveState();
        toast("Plus unlocked.");
        render();
      });
      document.getElementById("saveProfile")?.addEventListener("click", () => {
        const picked = document.getElementById("profileBlook")?.value || "";
        user.profileBlookName = picked && user.inventory.some(item => item.name === picked) ? picked : "";
        const nameInput = document.getElementById("profileName");
        const textColorInput = document.getElementById("profileTextColor");
        const nameColorInput = document.getElementById("profileNameColor");
        if (nameInput) user.name = nameInput.value.trim().slice(0, 18) || user.name;
        if (textColorInput) user.textColor = textColorInput.value;
        if (nameColorInput) user.nameColor = nameColorInput.value;
        saveState();
        toast("Profile saved.");
        render();
      });
    }

    function bindAdmin(user) {
      document.querySelectorAll(".toggle-mute").forEach(btn => btn.onclick = () => {
        const target = userById(btn.dataset.id);
        target.muted = !target.muted;
        saveState();
        render();
      });
      document.querySelectorAll(".toggle-ban").forEach(btn => btn.onclick = () => {
        const target = userById(btn.dataset.id);
        target.banned = !target.banned;
        saveState();
        render();
      });
      document.querySelectorAll(".toggle-plus").forEach(btn => btn.onclick = () => {
        const target = userById(btn.dataset.id);
        target.plus = !target.plus;
        if (target.plus) target.badge = "PLUS";
        saveState();
        render();
      });
      document.querySelectorAll(".toggle-admin").forEach(btn => btn.onclick = () => {
        const target = userById(btn.dataset.id);
        target.admin = !target.admin;
        if (target.admin) target.plus = true;
        saveState();
        render();
      });
      document.getElementById("adminAdd").onclick = () => {
        const target = userById(document.getElementById("adminUser").value);
        const amount = Math.max(0, Number(document.getElementById("adminAmount").value || 0));
        addTokens(target, amount);
        saveState();
        render();
      };
      document.getElementById("adminSubtract").onclick = () => {
        const target = userById(document.getElementById("adminUser").value);
        const amount = Math.max(0, Number(document.getElementById("adminAmount").value || 0));
        target.tokens = Math.max(0, target.tokens - amount);
        saveState();
        render();
      };
      document.getElementById("adminGiveBlook").onclick = () => {
        const target = userById(document.getElementById("adminUser").value);
        const item = JSON.parse(document.getElementById("adminBlook").value);
        addBlook(target, item, "Admin");
        saveState();
        toast("Blook granted.");
        render();
      };
      document.getElementById("adminSimRandom").onclick = () => {
        const pack = packs.find(p => p.id === document.getElementById("adminSimPack").value) || packs[0];
        const item = pickBlook(pack, { boosterUntil: 0 });
        showOpenModal(pack, [item], 1, { simulated: true });
      };
      document.getElementById("adminSimPack").onchange = () => {
        const packId = document.getElementById("adminSimPack").value;
        const select = document.getElementById("adminSimBlook");
        const match = Array.from(select.options).find(option => JSON.parse(option.value).packId === packId);
        if (match) select.value = match.value;
      };
      document.getElementById("adminSimForced").onclick = () => {
        const item = JSON.parse(document.getElementById("adminSimBlook").value);
        const pack = packs.find(p => p.id === item.packId) || packs.find(p => p.blooks.some(b => b.name === item.name)) || packs[0];
        showOpenModal(pack, [item], 1, { simulated: true });
      };
    }

    document.getElementById("loginMode").onclick = () => {
      authMode = "login";
      document.getElementById("loginMode").classList.add("primary");
      document.getElementById("registerMode").classList.remove("primary");
      document.getElementById("nameLabel").classList.add("hidden");
      document.getElementById("authSubmit").textContent = "Enter Packlet";
    };

    document.getElementById("registerMode").onclick = () => {
      authMode = "register";
      document.getElementById("registerMode").classList.add("primary");
      document.getElementById("loginMode").classList.remove("primary");
      document.getElementById("nameLabel").classList.remove("hidden");
      document.getElementById("authSubmit").textContent = "Create Account";
    };

    document.getElementById("togglePassword").onclick = () => {
      const input = document.getElementById("passwordInput");
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      document.getElementById("togglePassword").textContent = showing ? "Show" : "Hide";
    };

    document.getElementById("authSubmit").onclick = async () => {
      const login = normalizeLogin(document.getElementById("emailInput").value);
      const password = document.getElementById("passwordInput").value;
      if (!login || !password) return toast("Username and password are required.");
      if (authMode === "login" && SERVER_MODE) {
        try {
          const response = await fetch("/api/admin-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: login, password })
          });
          if (response.ok) {
            const remote = await response.json();
            state = ensureSeededAccounts(remote.state);
            localStorage.setItem("packlet_admin_token", remote.adminToken);
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
            sessionEmail = login;
            localStorage.setItem("packlet_session_email", sessionEmail);
            render();
            return;
          }
        } catch {}
      }
      if (authMode === "register") {
        if (userByLogin(login)) return toast("That username already has an account.");
        const name = document.getElementById("nameInput").value.trim().slice(0, 18) || login;
        state.users.push({ id: id(), email: login, password, name, tokens: 5000, totalTokens: 5000, messages: 0, packOpens: 0, pings: 0, xp: 0, muted: false, banned: false, plus: false, admin: false, badge: "", nameColor: "#eef4ff", textColor: "#eef4ff", paint: "", inventory: [], boosterUntil: 0, lastWheel: "" });
        saveState();
      }
      const user = userByLogin(login);
      if (!user || user.password !== password) return toast("Login did not match.");
      sessionEmail = user.email;
      localStorage.setItem("packlet_session_email", sessionEmail);
      if (cleanupCurrentUserMarketOnce()) saveState(false);
      render();
    };

    const didTradeMigration = migrateStaleBotTrades();
    const didMarketCleanup = cleanupCurrentUserMarketOnce();
    const didStartupCleanup = didTradeMigration || didMarketCleanup;
    if (didStartupCleanup) saveState(false);
    saveState(false);
    render();
    loadRemoteState();
    setInterval(() => {
      if (!currentUser()) return;
      if (document.hidden) return;
      const didChat = addBotChat("", 0.95);
      const didBuy = botBuyBazaar(0.55);
      const didList = botListBazaar(0.55);
      if (didChat || didBuy || didList) {
        saveState();
        if (currentView === "chat") refreshChatLog(currentUser());
        else if (["bazaar", "stats"].includes(currentView)) render();
      }
    }, 20000);
  </script>
</body>
</html>
